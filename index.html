<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaans Woordjes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7ff; --card:#ffffff; --text:#0f172a; --muted:#475569; --border:#e9e1fa;
  --primary:#7c3aed; --on-primary:#ffffff; --primary-soft:#f1eafe;
  --good:#047857; --good-soft:#e3f5ee; --bad:#b91c1c; --bad-soft:#fdeaea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111a; --card:#1e1b27; --text:#f1eef7; --muted:#b3adc2; --border:#332d42;
    --primary:#a78bfa; --on-primary:#160f2b; --primary-soft:#2a2340;
    --good:#4ade80; --good-soft:#173324; --bad:#f87171; --bad-soft:#3b1a1a;
  }
}
:root[data-theme="dark"]{
  --bg:#13111a; --card:#1e1b27; --text:#f1eef7; --muted:#b3adc2; --border:#332d42;
  --primary:#a78bfa; --on-primary:#160f2b; --primary-soft:#2a2340;
  --good:#4ade80; --good-soft:#173324; --bad:#f87171; --bad-soft:#3b1a1a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button{border:0;background:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:20px}
.head{font-family:"Baloo 2",system-ui,sans-serif}

/* bovenbalk: hoofdstuk + richting */
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{font-family:"Baloo 2",sans-serif;font-size:26px;line-height:1;margin:0 auto 0 0}
select,.pill{height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:15px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--primary-soft);padding:4px;border-radius:14px}
.tabs button{height:44px;border-radius:10px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:9px;background:var(--border);overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;background:var(--primary);transition:width .3s ease-out}

/* kaart */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:20px;min-height:280px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;width:100%}
.q,.a,.ex{display:block}
.q{font-family:"Baloo 2",sans-serif;font-size:clamp(32px,9vw,44px);line-height:1.1;margin:0}
.a{font-family:"Baloo 2",sans-serif;font-size:clamp(24px,7vw,32px);line-height:1.15;color:var(--primary);margin:0;animation:in .25s ease-out}
.ex{color:var(--muted);font-size:15px;max-width:420px;margin:4px 0 0;animation:in .25s ease-out}
.ex b{color:var(--text)}
.tap{color:var(--muted);font-size:15px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{height:56px;border-radius:14px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.main{grid-column:1/-1;background:var(--primary);color:var(--on-primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn svg{flex:none}

/* 4 keuzes */
#card{min-height:200px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{min-height:56px;padding:10px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:17px;font-weight:600;text-align:left;display:flex;align-items:center;gap:12px;transition:background .2s,border-color .2s,opacity .2s}
.opt:not(:disabled):hover{border-color:var(--primary)}
.opt:not(:disabled):active{transform:scale(.98)}
.opt .num{flex:none;width:24px;height:24px;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:13px;display:grid;place-items:center}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}

/* koppelen */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{min-height:60px;padding:8px 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:16px;font-weight:600;line-height:1.25;transition:background .2s,border-color .2s,opacity .25s}
.tile.sel{border-color:var(--primary);background:var(--primary-soft)}
.tile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.45;cursor:default}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}

/* einde */
.end h2{font-family:"Baloo 2",sans-serif;font-size:32px;margin:0}
.end p{margin:0;color:var(--muted)}
.miss{list-style:none;padding:0;margin:8px 0 0;width:100%;max-width:360px;text-align:left}
.miss li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:15px}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- restaurant ---------- */
:root{--coin:#b45309;--coin-soft:#fef3c7;--clay-shadow:0 4px 0 rgba(76,29,149,.18),0 8px 18px rgba(76,29,149,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--coin:#fbbf24;--coin-soft:#3a2c0e;--clay-shadow:0 4px 0 rgba(0,0,0,.45),0 8px 18px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--coin:#fbbf24;--coin-soft:#3a2c0e;--clay-shadow:0 4px 0 rgba(0,0,0,.45),0 8px 18px rgba(0,0,0,.3)}
body.ingame .top,body.ingame .tabs{display:none}
body.ingame .wrap{gap:10px;padding-top:12px}
.resto{display:flex;flex-direction:column;gap:14px}
.ghud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.gname{font-family:"Baloo 2",sans-serif;font-size:19px;line-height:1.05;margin-right:auto;min-width:0}
.gname small{display:block;font:600 13px system-ui,sans-serif;color:var(--muted)}
.resto>.ghud .chip.coin{margin-right:auto}
.chip{height:40px;min-width:40px;padding:0 12px;border-radius:999px;background:var(--card);border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.chip.coin{color:var(--coin);background:var(--coin-soft);border-color:transparent}
.ibtn{width:44px;height:44px;padding:0;box-shadow:var(--clay-shadow)}
.ibtn:active{transform:translateY(2px);box-shadow:none}
.stars{display:inline-flex;gap:1px;color:var(--coin)}
.btn.clay{box-shadow:var(--clay-shadow);border:2px solid rgba(255,255,255,.25)}
.btn.clay:active{transform:translateY(3px);box-shadow:none}
.lbl{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 -6px}
.place{border-radius:22px;background:var(--card);border:2px solid var(--border);overflow:hidden;box-shadow:var(--clay-shadow)}
.place.shut{opacity:.6}
.band{padding:12px 16px;color:#fff;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.band b{font-family:"Baloo 2",sans-serif;font-size:20px;line-height:1.1}
.band span{font-size:13px;font-weight:700;opacity:.9}
.lvls{display:flex;flex-wrap:wrap;gap:10px;padding:14px}
.lvl{width:58px;height:64px;border-radius:18px;background:var(--primary-soft);color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 rgba(76,29,149,.2);transition:transform .1s}
.lvl .n{font-family:"Baloo 2",sans-serif;font-size:22px;line-height:1;font-weight:700;display:flex}
.lvl .ls{display:flex;color:var(--coin)}
.lvl.now{background:var(--primary);color:var(--on-primary);animation:bounce 1.4s ease-in-out infinite}
.lvl.now .ls{color:var(--on-primary)}
.lvl:disabled{background:var(--border);color:var(--muted);box-shadow:none;cursor:default}
.lvl:not(:disabled):active{transform:translateY(3px);box-shadow:none}
@keyframes bounce{50%{transform:translateY(-3px)}}
.how{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:12px 16px;font-size:15px}
.how summary{font-weight:800;cursor:pointer;min-height:24px}
.how ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.how li{margin:4px 0}
.gwrap{display:flex;flex-direction:column;gap:10px}
.cvbox{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--clay-shadow);max-width:420px;width:100%;margin:0 auto;background:#000}
#cv{display:block;width:100%;aspect-ratio:360/560;touch-action:manipulation;cursor:pointer}
.ghint{margin:0;text-align:center;font-weight:700;font-size:15px;color:var(--muted);min-height:44px}
.sheetbg{position:fixed;inset:0;background:rgba(15,10,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheetbg.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:520px;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:rise .22s ease-out;display:flex;flex-direction:column;gap:6px}
.sheetbg.center .sheet{border-radius:26px;align-items:center;text-align:center;max-height:calc(100dvh - 32px);overflow:auto}
.clay-card{border:2px solid var(--border);box-shadow:var(--clay-shadow)}
.sheet .q{text-align:center;margin:0}
.sheet .hint{text-align:center;color:var(--muted);font-size:14px;margin:0}
.sheet .opts{margin-top:8px}
.tag{align-self:center;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;background:#dc2626}
.tag.t-vip{background:#7c3aed}.tag.t-critic{background:#334155}
.bigstars{display:flex;gap:6px;color:var(--border)}
.bigstars span{animation:popin .4s ease-out backwards}
.bigstars span.on{color:var(--coin)}
@keyframes popin{from{transform:scale(.3);opacity:0}}
.end h2{font-family:"Baloo 2",sans-serif;font-size:30px;margin:0}
.end p{margin:0;color:var(--muted)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px)}}
.shop{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--border)}
.item .txt{flex:1;min-width:0}
.item b{display:block;font-size:16px}
.item span{display:block;font-size:13px;color:var(--muted)}
.buy{min-width:86px;height:44px;border-radius:14px;background:var(--coin-soft);color:var(--coin);font-weight:800;padding:0 12px;flex:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(180,83,9,.25)}
.buy:not(:disabled):active{transform:translateY(3px);box-shadow:none}
.buy:disabled{opacity:.45;cursor:default;box-shadow:none}
.buy.max{background:var(--good-soft);color:var(--good);opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{background:var(--primary-soft);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:"Baloo 2",sans-serif;font-size:24px;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>Spaans woordjes</h1>
    <label class="sr" for="chap" style="position:absolute;left:-9999px">Hoofdstuk</label>
    <select id="chap">
      <option value="all">Examen 1 + 2</option>
      <option value="1">Examen 1</option>
      <option value="2">Examen 2</option>
    </select>
    <button class="pill" id="dir" aria-label="Wissel richting"></button>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tCards" aria-selected="true">Kaarten</button>
    <button role="tab" id="tMatch" aria-selected="false">Koppelen</button>
    <button role="tab" id="tGame" aria-selected="false">Restaurant</button>
  </div>

  <section id="play">
    <div class="meta"><span id="mLeft"></span><span id="mRight"></span></div>
    <div class="track"><i id="bar"></i></div>
  </section>

  <div id="stage"></div>
</main>

<script>
// [spaans, nederlands] — Todo bajo control, examen 1 en 2
const CH = {
1: {name:"Examen 1", groups:[
 ["Zelfstandige naamwoorden", [
  ["el agua","het water"],["el café / el té","de koffie / de thee"],["la concentración","de concentratie"],["el queso","de kaas"],
  ["el ejercicio","de oefening"],["el bolígrafo","de pen"],["el libro","het boek"],["la pregunta","de vraag"],
  ["la respuesta","het antwoord"],["la mesa","de tafel"]]],
 ["Bijvoeglijke naamwoorden", [
  ["caliente","warm"],["frío","koud"],["grande","groot"],["pequeño","klein"],["nuevo","nieuw"],["viejo","oud"],
  ["molesto","irritant"],["lógico","logisch"]]],
 ["Werkwoorden", [
  ["abrir","openen"],["beber","drinken"],["buscar","zoeken"],["cantar","zingen"],["comer","eten"],["comprar","kopen"],
  ["comprender","begrijpen"],["escuchar","luisteren"],["escribir","schrijven"],["estudiar","studeren"],["hablar","spreken"],
  ["leer","lezen"],["mirar","kijken"],["necesitar","nodig hebben"],["responder","antwoorden"],["tocar (música)","spelen (muziek)"],
  ["trabajar","werken"],["subir","posten / uploaden"],["viajar","reizen"],["vivir","leven / wonen"]]],
 ["Bijwoorden", [
  ["mucho","veel"],["poco","weinig"],["bien","goed"],["genial","geniaal"],["mal","slecht"],["fatal","fataal"]]],
 ["Voegwoorden", [
  ["también","ook"],["tampoco","ook niet"],["hacia","naar"],["con","met"],["de","van"],["en / sobre / a","in / op / bij"],
  ["o","of"],["pero","maar"],["y","en"]]],
 ["Super handig", [
  ["hola","hallo"],["adiós","dag"],["bienvenido","welkom"],["encantado/a","aangenaam"],["buenos días","goedemorgen"],
  ["buenas tardes","goedemiddag"],["buenas noches","goedenavond"],["¿qué significa…?","wat betekent…?"],["por favor","alsjeblieft (aub)"],
  ["gracias / de nada","bedankt / geen dank"],["lo siento","sorry"]]]
]},
2: {name:"Examen 2", groups:[
 ["De kleuren", [
  ["amarillo","geel"],["azul","blauw"],["blanco","wit"],["gris","grijs"],["marrón","bruin"],["negro","zwart"],
  ["rojo","rood"],["rosa","roze"],["verde","groen"],["violeta","violet"]]],
 ["De kapper", [
  ["el cabello blanco","het witte haar"],["el cabello castaño","het bruine haar"],["el cabello oscuro","het donkere haar"],
  ["el cabello rojo","het rode haar"],["el cabello rubio","het blonde haar"]]],
 ["De kledingwinkel", [
  ["el traje de baño","het badpak"],["el bikini","de bikini"],["la bufanda","de sjaal"],["el calcetín","de sok"],
  ["la camiseta","het t-shirt"],["la chancla","de slipper"],["el cinturón","de riem"],["la falda","de rok"],
  ["el suéter","de trui"],["las gafas de sol","de zonnebril"],["los pantalones","de (spijker)broek"],["el sombrero","de hoed"],
  ["el vestido","de jurk"],["el zapato (de tacón)","de schoen (met hak)"],["la vendedora","de verkoopster"],["el/la modelo","het model"]]],
 ["Lichaamsdelen", [
  ["la boca","de mond"],["el brazo","de arm"],["el cuello","de nek"],["el dedo del pie","de teen"],["el dedo","de vinger"],
  ["el diente","de tand"],["la mano","de hand"],["la nariz","de neus"],["el ojo","het oog"],["la oreja","het oor"],
  ["el pie","de voet"],["la pierna","het been"]]],
 ["De week", [
  ["lunes","maandag"],["martes","dinsdag"],["miércoles","woensdag"],["jueves","donderdag"],["viernes","vrijdag"],
  ["el fin de semana","het weekend"],["sábado","zaterdag"],["domingo","zondag"]]],
 ["Werkwoorden", [["ser","zijn"],["valer","kosten"]]],
 ["Vraagwoorden", [
  ["cómo","hoe"],["cuál","welke"],["cuándo","wanneer"],["cuánto","hoeveel"],["de dónde","van waar"],["dónde","waar"],
  ["por qué","waarom"],["qué","wat"],["quién","wie"]]]
]}
};


const WORDS = [];
for (const [ch, c] of Object.entries(CH)) for (const [grp, list] of c.groups)
  for (const [f, n, ex] of list) WORDS.push({ch, grp, f, n, ex});

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ICON = {
  x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>',
  swap: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>'
};

let chap = "all", fr2nl = true, mode = "cards";
const pool = () => WORDS.filter(w => chap === "all" || w.ch === chap);
const Q = w => fr2nl ? w.f : w.n, A = w => fr2nl ? w.n : w.f;

function setMeta(left, right, pct){ $("#mLeft").textContent = left; $("#mRight").textContent = right; $("#bar").style.width = pct + "%"; }
function start(){ $("#play").classList.remove("hidden"); stopGame(); mode === "cards" ? startCards() : mode === "match" ? startMatch() : startGame(); }

$("#chap").onchange = e => { chap = e.target.value; start(); };
function renderDir(){ $("#dir").innerHTML = (fr2nl ? "ES → NL " : "NL → ES ") + ICON.swap; }
$("#dir").onclick = () => { fr2nl = !fr2nl; renderDir(); start(); };
const TABS = [["#tCards","cards"],["#tMatch","match"],["#tGame","game"]];
for (const [id, m] of TABS)
  $(id).onclick = () => { mode = m; for (const [i, x] of TABS) $(i).setAttribute("aria-selected", x === m); start(); };

// ---------- kaarten ----------
const BLOCK = 10;
let queue, cur, opts, picked, total, done, missed, blocks, bi, bDone, bMissed;
function startCards(){
  const p = shuffle(pool()); total = p.length; done = 0; missed = new Set();
  blocks = [];
  for (let i = 0; i < p.length; i += BLOCK) blocks.push(p.slice(i, i + BLOCK));
  if (blocks.length > 1 && blocks.at(-1).length < 5) blocks.at(-2).push(...blocks.pop()); // geen mini-blokje aan het eind
  bi = 0; startBlock();
}
// een blok is pas klaar als je elk woord 3x achter elkaar goed hebt; een fout zet de teller van dat woord terug op 0
const STREAK = 3;
let streak;
function startBlock(){ queue = shuffle(blocks[bi]); bDone = 0; bMissed = new Set(); streak = new Map(); next(); }
function next(){
  if (!queue.length) return blockEnd();
  cur = queue.shift(); picked = null; opts = choices(cur); drawCard();
}
// 3 foute keuzes: eerst uit dezelfde groep (lijkt meer op elkaar), dan uit de rest; nooit dezelfde tekst als het goede antwoord
function choices(w){
  const seen = new Set([A(w)]), out = [A(w)];
  const others = [...shuffle(WORDS.filter(x => x.grp === w.grp && x.ch === w.ch)), ...shuffle(WORDS.filter(x => x.ch === w.ch)), ...shuffle(WORDS)];
  for (const x of others){ if (out.length === 4) break; if (!seen.has(A(x))){ seen.add(A(x)); out.push(A(x)); } }
  return shuffle(out);
}
function drawCard(){
  setMeta("Blok " + (bi + 1) + " van " + blocks.length + " · " + bDone + "/" + blocks[bi].length + " goed",
    bMissed.size ? bMissed.size + " fout" : "", [...streak.values()].reduce((a, b) => a + b, 0) / (blocks[bi].length * STREAK) * 100);
  const answered = picked !== null, right = A(cur);
  $("#stage").innerHTML = `
    <div class="card" id="card">
      <span class="q">${esc(Q(cur))}</span>

const PER = 5;
let rounds, ri, errors, sel, left;
function startMatch(){
  // geen dubbele vertalingen in één ronde (bv. twee keer 'kortom')
  rounds = [];
  for (const w of shuffle(pool())){
    let r = rounds.find(r => r.length < PER && !r.some(x => x.n === w.n || x.f === w.f));
    if (!r) rounds.push(r = []);
    r.push(w);
  }
  rounds = rounds.filter(r => r.length > 1); ri = 0; errors = 0; drawRound();
}
function drawRound(){
  const r = rounds[ri]; left = r.length; sel = null;
  setMeta("Ronde " + (ri + 1) + " van " + rounds.length, errors ? errors + " fout" : "", ri / rounds.length * 100);
  const tile = (w, side) => `<button class="tile" data-i="${r.indexOf(w)}" data-s="${side}">${esc(side === "q" ? Q(w) : A(w))}</button>`;
  $("#stage").innerHTML = `<div class="grid"><div class="col">${shuffle(r).map(w => tile(w, "q")).join("")}</div><div class="col">${shuffle(r).map(w => tile(w, "a")).join("")}</div></div>`;
  document.querySelectorAll(".tile").forEach(t => t.onclick = () => pick(t));
}
function pick(t){
  if (t.classList.contains("ok")) return;
  if (!sel || sel.dataset.s === t.dataset.s){
    sel?.classList.remove("sel");
    sel = sel === t ? null : t; sel?.classList.add("sel");
    return;
  }
  const a = sel; sel = null; a.classList.remove("sel");
  if (a.dataset.i === t.dataset.i){
    a.classList.add("ok"); t.classList.add("ok"); a.disabled = t.disabled = true;
    if (--left === 0) setTimeout(() => ++ri < rounds.length ? drawRound() : matchEnd(), 400);
  } else {
    errors++; setMeta("Ronde " + (ri + 1) + " van " + rounds.length, errors + " fout", ri / rounds.length * 100);
    for (const x of [a, t]){ x.classList.remove("no"); void x.offsetWidth; x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 400); }
  }
}
function matchEnd(){
  setMeta("Alle rondes klaar", "", 100);
  $("#stage").innerHTML = `<div class="card end"><h2>${errors ? "Klaar" : "Alles goed"}</h2>
    <p>${errors ? errors + " keer fout gekoppeld." : "Geen enkele fout."}</p></div>

}

    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);

  } catch(e){}
}

function pickWord(not){
  const busy = new Set(R.guests.filter(g => g.state === "in" || g.state === "order").map(g => g.word));
  const c = R.block.filter(w => (R.streak.get(w) || 0) < STREAK && !busy.has(w) && w !== not);
  if (!c.length) return null;
  c.sort((a, b) => (R.seen.get(a) ?? -99) - (R.seen.get(b) ?? -99));
  return c[Math.random() * Math.min(3, c.length) | 0];
}
function spawnGuest(){
  const ti = R.tables.findIndex(t => !t.g && !t.cash); if (ti < 0) return false;
  const w = pickWord(); if (!w) return false;
  const r = Math.random(), type = R.pi >= 1 && r < .1 ? "vip" : R.pi >= 1 && r < .16 ? "critic" : r < .34 ? "haast" : "normal";
  const t = R.tables[ti], sy = t.y - 24;
  const g = {id:++uid, type, word:w, state:"in", x:AISLE + (Math.random() * 10 - 5), y:DOOR_Y, path:[[AISLE, sy], [t.x, sy]], table:ti, pat:1,
    skin:SKIN[Math.random() * 5 | 0], hair:HAIR[Math.random() * 6 | 0], shirt:SHIRT[Math.random() * 8 | 0], walk:0, eat:0};
  t.g = g.id; R.guests.push(g); SFX.bell(); return true;
}
function routeTo(e, x, y){ e.path = [[AISLE, e.y], [AISLE, y], [x, y]]; }
function move(e, dt, sp){
  if (!e.path.length) return false;
  const [tx, ty] = e.path[0], dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy), s = sp * dt;
  if (d <= s){ e.x = tx; e.y = ty; e.path.shift(); } else { e.x += dx / d * s; e.y += dy / d * s; }
  e.walk += dt;
  return !e.path.length;
}
function pop(x, y, txt, col){ R.pops.push({x, y, txt, col, t:0}); }

function guestLeave(g, angry){
  const t = R.tables[g.table]; if (t && t.g === g.id) t.g = null;
  for (const tk of R.tickets.filter(k => k.g === g.id)){
    R.stations.forEach(s => { if (s.job && s.job.tk === tk) s.job = null; });
    R.pass = R.pass.filter(k => k !== tk);
    R.waiters.forEach(w => { if (w.tk === tk){ w.tk = null; w.carry = null; w.ph = "idle"; } });
  }
  R.tickets = R.tickets.filter(k => k.g !== g.id);
  g.state = "out"; g.path = [[AISLE, g.y], [AISLE, DOOR_Y + 20]];
  if (angry){
    R.lost++; R.cmb = 0; S.rating = Math.max(1, S.rating - (g.type === "critic" ? .7 : .25));
    pop(g.x, g.y - 60, g.type === "critic" ? "Slechte recensie" : "Weg!", "#dc2626"); SFX.bad();
  }
}
function loop(t){
  if (!R) return;
  const dt = Math.min(.1, (t - lastT) / 1000); lastT = t;
  if (!R.sheet && !R.over) step(dt);
  draw(); raf = requestAnimationFrame(loop);
}
function step(dt){
  R.time += dt;
  if (!R.closing && (R.spawnT -= dt) <= 0) R.spawnT = spawnGuest() ? (3 + Math.random() * 3) / (.7 + S.rating * .1) : .5;
  // gasten
  for (const g of R.guests.slice()){
    const arrived = move(g, dt, 70);
    if (g.state === "in" && arrived){ g.state = "order"; g.walk = 0; }
    else if (g.state === "out" && arrived){ R.guests = R.guests.filter(x => x !== g); continue; }
    if (g.state === "order" || g.state === "food"){
      g.pat -= dt / patSec(g) * (g.state === "food" ? .5 : 1);
      if (g.pat <= 0) guestLeave(g, true);
    } else if (g.state === "eat" && (g.eat -= dt) <= 0){
      const d = dish(g.dish), t = R.tables[g.table];
      const pay = Math.round(d.price * GTYPE[g.type].pay * g.mul * (.75 + .45 * g.pat + (g.fast ? .15 : 0)) * (1 + (S.up.decor * .05)));
      t.cash += pay; R.served++;
      S.rating = Math.min(5, S.rating + (g.type === "critic" ? .45 : .06));
      if (g.type === "critic") pop(t.x, t.y - 70, "Goede recensie!", "#047857");
      guestLeave(g, false);
    }
  }
  // keuken
  for (const s of R.stations){
    const j = s.job; if (!j) continue;
    if (j.st === "cook"){ j.t += dt; if (j.t >= j.dur){ j.st = "ready"; j.bt = 0; SFX.ding(); } }
    else if (ST[s.type].burn){
      j.bt += dt;
      if (j.bt > 6.5 && Math.random() < dt * 6) R.smoke.push({x:s.x + (Math.random() * 16 - 8), y:70, t:0});
      if (j.bt > 10){ // aangebrand: deze stap moet opnieuw
        j.tk.state = "queue"; s.job = null; R.burnt++; SFX.burn(); pop(s.x, 60, "Aangebrand!", "#dc2626");
      }
    }
  }
  if (S.up.chef && (R.helpT -= dt) <= 0){
    R.helpT = .8;
    const s = R.stations.find(s => s.job && s.job.st === "ready") || R.stations.find(s => s.owned && !s.job && nextTicket(s.type));
    if (s) tapStation(s, true);
  }
  move(R.chef, dt, 170);
  // obers
  for (const w of R.waiters){
    if (w.ph === "idle"){
      const tk = R.pass.find(k => !k.w);
      if (tk){ tk.w = w; w.tk = tk; w.ph = "pick"; w.path = [[AISLE, w.y < 200 ? w.y : 184], [AISLE, 184], [passX(tk), 178]]; }
      else if (!w.path.length && (w.x !== w.hx || w.y !== w.hy)) routeTo(w, w.hx, w.hy);
    }
    const arrived = move(w, dt, wspeed());
    if (!arrived) continue;
    if (w.ph === "pick"){
      const tk = w.tk, g = tk && guestById(tk.g);
      R.pass = R.pass.filter(k => k !== tk);
      if (!g){ w.ph = "idle"; w.tk = null; continue; }
      const t = R.tables[g.table]; w.carry = tk.dish; w.ph = "serve";
      w.path = [[AISLE, 184], [AISLE, t.y + 8], [t.x < AISLE ? t.x + 50 : t.x - 50, t.y + 8]];
    } else if (w.ph === "serve"){
      const tk = w.tk, g = tk && guestById(tk.g);
      if (g && g.state === "food"){ g.state = "eat"; g.eat = 3.5; g.dish = tk.dish; }
      R.tickets = R.tickets.filter(k => k !== tk);
      w.tk = null; w.carry = null; w.ph = "idle";
    }
  }
  // geld ophalen door de afruimer
  if (S.up.busser) for (const t of R.tables) if (t.cash && (t.ct += dt) > 1.4) collect(t);
  for (const p of R.pops) p.t += dt; R.pops = R.pops.filter(p => p.t < 1.4);
  for (const s of R.smoke) s.t += dt; R.smoke = R.smoke.filter(s => s.t < 1.2);
  if (R.closing){
    for (const g of R.guests.slice()) if (g.state === "in" || g.state === "order") guestLeave(g, false);
    if (!R.guests.length){ R.tables.forEach(t => t.cash && collect(t)); return levelEnd(); }
  }
  if ((R.hintT -= dt) <= 0){ R.hintT = .4; hint(); }
}
const passX = tk => 60 + Math.max(0, R.pass.indexOf(tk)) * 48;
function nextTicket(type){ return R.tickets.find(k => k.state === "queue" && dish(k.dish).steps[k.step][0] === type); }
function tapStation(s, auto){
  if (!s.owned) return auto || setHint((s.type === "fogon" ? "Dit " : "Deze ") + ST[s.type].nl + " heb je nog niet. Koop het in de winkel.");
  const j = s.job;
  if (j){
    if (j.st !== "ready") return;
    const tk = j.tk; s.job = null; tk.step++;
    if (tk.step >= dish(tk.dish).steps.length){ tk.state = "pass"; R.pass.push(tk); } else tk.state = "queue";
    R.chef.path = [[s.x, 126]]; if (!auto) SFX.ok(); return;
  }
  const tk = nextTicket(s.type);
  if (!tk) return auto || setHint("Er wacht niets op " + ST[s.type].de + " " + ST[s.type].nl + ".");
  const [, sec] = dish(tk.dish).steps[tk.step];
  tk.state = "busy"; s.job = {tk, t:0, dur:sec, st:"cook", bt:0}; R.chef.path = [[s.x, 126]];
}
function collect(t){
  if (!t.cash) return;
  S.coins += t.cash; R.earned += t.cash; pop(t.x, t.y - 10, "+€" + t.cash, "#b45309"); SFX.coin();
  t.cash = 0; t.ct = 0; save(); const c = $("#gCoins"); if (c) c.textContent = S.coins; meta();
}
let hintLock = 0;
function setHint(s){ hintLock = performance.now() + 2200; const h = $("#gHint"); if (h) h.textContent = s; }
function hint(){
  if (performance.now() < hintLock) return;
  const burning = R.stations.find(s => s.job && s.job.st === "ready" && ST[s.type].burn && s.job.bt > 5);
  const ready = R.stations.find(s => s.job && s.job.st === "ready");
  const q = R.tickets.find(k => k.state === "queue");
  const free = q && R.stations.find(s => s.owned && !s.job && s.type === dish(q.dish).steps[q.step][0]);
  const cash = R.tables.find(t => t.cash);
  const ask = R.guests.find(g => g.state === "order");
  const s = burning ? "Snel! Er brandt iets aan op " + ST[burning.type].de + " " + ST[burning.type].nl + ". Tik erop."
    : ready ? "Klaar op " + ST[ready.type].de + " " + ST[ready.type].nl + ". Tik erop."
    : free ? "Tik op " + (free.type === "fogon" ? "een vrij " : "een vrije ") + ST[free.type].nl + " voor de " + dish(q.dish).name.toLowerCase() + "."
    : cash ? "Tik op het geld op de tafel."
    : ask ? "Tik op de gast met een ! om de bestelling op te nemen."
    : R.closing ? "Alle woorden gekend. De laatste gasten worden bediend." : "Wachten op gasten...";
  const h = $("#gHint"); if (h && h.textContent !== s) h.textContent = s;
}

// ---- tikken op het canvas ----
function onCanvas(e){
  if (!R || R.sheet || R.over) return;
  const r = e.currentTarget.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * CW, y = (e.clientY - r.top) / r.height * CHH;
  if (y > 40 && y < 118){ const s = R.stations.find(s => Math.abs(s.x - x) < 29); if (s) return tapStation(s); }
  const t = R.tables.find(t => t.cash && Math.abs(t.x - x) < 44 && Math.abs(t.y - y) < 38); if (t) return collect(t);
  const g = R.guests.filter(g => g.state === "order").find(g => Math.abs(g.x - x) < 30 && y > g.y - 70 && y < g.y + 30);
  if (g) return askGuest(g);
}
function askGuest(g){
  R.sheet = {g, opts:choices(g.word), picked:null, t0:performance.now()}; drawSheet();
  $("#gOver .opt")?.focus();
}
function drawSheet(){
  const sh = R.sheet, o = $("#gOver"); if (!sh){ o.innerHTML = ""; return; }
  const {g, opts, picked} = sh, ans = A(g.word), ty = GTYPE[g.type];
  o.innerHTML = `<div class="sheetbg" data-act="close"><div class="sheet clay-card" role="dialog" aria-label="Bestelling opnemen">
    ${ty.label ? `<span class="tag t-${g.type}">${ty.label}${g.type === "vip" ? " · dubbel geld" : g.type === "critic" ? " · telt zwaar voor je sterren" : " · weinig geduld"}</span>` : ""}
    <p class="hint">De gast zegt:</p><div class="q">${esc(Q(g.word))}</div>
    <p class="hint">${picked === null ? "Wat betekent dat?" : picked === ans ? "¡Perfecto! Bestelling genoteerd." : "Bijna. Het goede antwoord is groen."}</p>
    <div class="opts">${opts.map((op, i) => {
      const cls = picked === null ? "" : op === ans ? "ok" : op === picked ? "no" : "dim";
      const mark = cls === "ok" ? ICON.check : cls === "no" ? ICON.x : `<span class="num">${i + 1}</span>`;
      return `<button class="opt ${cls}" data-opt="${i}" ${picked !== null ? "disabled" : ""}>${mark}${esc(op)}</button>`;
    }).join("")}</div></div></div>`;
}
function answer(i){
  const sh = R.sheet; if (!sh || sh.picked !== null) return;
  const g = sh.g, w = g.word, ok = (sh.picked = sh.opts[i]) === A(w);
  R.seen.set(w, R.tick++);
  if (ok){
    R.right++; R.cmb++; R.streak.set(w, (R.streak.get(w) || 0) + 1);
    g.fast = performance.now() - sh.t0 < 4000; g.mul = combo();
    const m = menuNow(); g.state = "food"; g.dish = m[Math.random() * m.length | 0]; g.pat = Math.min(1, g.pat + .3);
    R.tickets.push({id:++uid, g:g.id, dish:g.dish, step:0, state:"queue", w:null}); SFX.ok();
  } else {
    R.wrong++; R.cmb = 0; R.streak.set(w, 0); R.missed.add(w); g.pat = Math.max(.08, g.pat - .25); SFX.bad();
  }
  drawSheet(); meta();
  setTimeout(() => {
    if (!R || R.sheet !== sh) return;
    R.sheet = null; drawSheet();
    if (!ok){ const nw = pickWord(w); if (nw) g.word = nw; }
    if (R.block.every(x => (R.streak.get(x) || 0) >= STREAK)) R.closing = true;
    lastT = performance.now();
  }, ok ? 650 : 1600);
}
function levelEnd(){
  R.over = true;
  const r = R, k = key(r.li), m = [...r.missed];
  const stars = 1 + (r.earned >= target(r.li) ? 1 : 0) + (r.earned >= target(r.li) && r.lost === 0 ? 1 : 0);
  S.stars[k] = Math.max(S.stars[k] || 0, stars); save(); SFX.win();
  setMeta("Level " + (r.li + 1) + " klaar", "", 100);
  const hasNext = r.li + 1 < r.n;
  $("#gOver").innerHTML = `<div class="sheetbg center"><div class="sheet clay-card end" role="dialog" aria-label="Level klaar">
    <div class="bigstars">${[1,2,3].map(i => `<span class="${stars >= i ? "on" : ""}" style="animation-delay:${i * .15}s">${STARSVG(stars >= i, 44)}</span>`).join("")}</div>
    <h2>Level ${r.li + 1} klaar!</h2>
    <div class="stats"><div><b>€${r.earned}</b><span>doel €${target(r.li)}</span></div><div><b>${r.served}</b><span>gasten blij</span></div><div><b>${r.lost}</b><span>weggelopen</span></div></div>
    <p>${stars === 3 ? "Perfect: doel gehaald en niemand weggelopen." : stars === 2 ? "Doel gehaald. Laat niemand weglopen voor 3 sterren." : "Haal €" + target(r.li) + " voor de 2e ster."}${r.burnt ? " " + r.burnt + "x aangebrand." : ""}</p>
    ${m.length ? `<ul class="miss">${m.map(w => `<li><b>${esc(w.f)}</b><span>${esc(w.n)}</span></li>`).join("")}</ul>` : ""}
    <div class="btns" style="width:100%">${hasNext ? `<button class="btn main clay" data-lvl="${r.li + 1}">Volgende level</button>` : ""}
      <button class="btn soft" data-lvl="${r.li}">Opnieuw</button><button class="btn soft" data-act="map">Naar de kaart</button></div></div></div>`;
  $("#gOver .btn")?.focus();
}

// =================== TEKENEN ===================
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circ(x, y, r, c){ ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = c; ctx.fill(); }
function ell(x, y, rx, ry, c){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fillStyle = c; ctx.fill(); }
function plate(x, y, d, s = 1){ ell(x, y + 2 * s, 13 * s, 7 * s, "rgba(0,0,0,.15)"); ell(x, y, 13 * s, 7 * s, "#fff"); ell(x, y - 1 * s, 9 * s, 5 * s, d.c); circ(x - 3 * s, y - 2 * s, 1.8 * s, d.c2); circ(x + 3 * s, y, 1.8 * s, d.c2); }
function person(p, o){
  const x = p.x, y = p.y, moving = p.path && p.path.length, bob = moving ? Math.abs(Math.sin(p.walk * 11)) * 2.2 : 0;
  ell(x, y, 11, 4, "rgba(0,0,0,.18)");
  if (!o.seated){
    const sw = moving ? Math.sin(p.walk * 11) * 3 : 0;
    ctx.fillStyle = o.legs || "#3b3346"; rr(x - 6, y - 13 + sw * .3, 5, 13 - sw * .3, 2); ctx.fill(); rr(x + 1, y - 13 - sw * .3, 5, 13 + sw * .3, 2); ctx.fill();
  }
  const by = y - 32 - bob;
  ctx.fillStyle = o.shirt; rr(x - 10, by, 20, 21, 8); ctx.fill();
  if (o.apron){ ctx.fillStyle = "#fff"; rr(x - 6, by + 6, 12, 14, 3); ctx.fill(); }
  if (o.bow){ ctx.fillStyle = "#111"; ctx.beginPath(); ctx.moveTo(x - 4, by + 2); ctx.lineTo(x + 4, by + 6); ctx.lineTo(x + 4, by + 2); ctx.lineTo(x - 4, by + 6); ctx.fill(); }
  const hy = by - 8;
  circ(x, hy, 9.5, o.skin);
  ctx.fillStyle = o.hair; ctx.beginPath(); ctx.arc(x, hy - 1, 9.8, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  if (o.hat){ circ(x - 5, hy - 12, 5, "#fff"); circ(x + 5, hy - 12, 5, "#fff"); circ(x, hy - 15, 6, "#fff"); ctx.fillStyle = "#fff"; ctx.fillRect(x - 8, hy - 11, 16, 5); }
  if (o.crown){ ctx.fillStyle = "#f5b301"; ctx.beginPath(); ctx.moveTo(x - 7, hy - 8); ctx.lineTo(x - 7, hy - 15); ctx.lineTo(x - 3.5, hy - 11); ctx.lineTo(x, hy - 16); ctx.lineTo(x + 3.5, hy - 11); ctx.lineTo(x + 7, hy - 15); ctx.lineTo(x + 7, hy - 8); ctx.fill(); }
  const ey = hy + 1;
  if (o.glasses){ ctx.strokeStyle = "#111"; ctx.lineWidth = 1.4; ctx.strokeRect(x - 7, ey - 2.5, 5.5, 4.5); ctx.strokeRect(x + 1.5, ey - 2.5, 5.5, 4.5); ctx.beginPath(); ctx.moveTo(x - 1.5, ey); ctx.lineTo(x + 1.5, ey); ctx.stroke(); }
  circ(x - 3.5, ey, 1.4, "#2a1d16"); circ(x + 3.5, ey, 1.4, "#2a1d16");
  ctx.strokeStyle = "#2a1d16"; ctx.lineWidth = 1.5; ctx.lineCap = "round"; ctx.beginPath();
  if (o.mood === "happy") ctx.arc(x, hy + 3.5, 3, .15 * Math.PI, .85 * Math.PI);
  else if (o.mood === "angry") ctx.arc(x, hy + 8, 3, 1.2 * Math.PI, 1.8 * Math.PI);
  else { ctx.moveTo(x - 2.5, hy + 5.5); ctx.lineTo(x + 2.5, hy + 5.5); }
  ctx.stroke();
  if (o.carry){ plate(x + 12, by + 4, dish(o.carry), .8); }
}
function bubble(x, y, w, h){ ctx.fillStyle = "#fff"; rr(x - w / 2, y - h, w, h, 9); ctx.fill(); ctx.beginPath(); ctx.moveTo(x - 5, y - .5); ctx.lineTo(x + 5, y - .5); ctx.lineTo(x, y + 6); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,.08)"; ctx.lineWidth = 1; rr(x - w / 2, y - h, w, h, 9); ctx.stroke(); }
function ring(x, y, r, f, c, lw = 4){ ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.stroke(); }
function draw(){
  if (!ctx || !R) return;
  const P = R.P, T = R.time;
  // vloer
  for (let y = 112; y < CHH; y += 24) for (let x = 0; x < CW; x += 24){ ctx.fillStyle = ((x + y) / 24) % 2 ? P.f1 : P.f2; ctx.fillRect(x, y, 24, 24); }
  if (S.up.decor >= 3){ ctx.fillStyle = "#b8323a"; ctx.fillRect(AISLE - 22, 190, 44, 370); ctx.fillStyle = "#d9a441"; ctx.fillRect(AISLE - 22, 190, 3, 370); ctx.fillRect(AISLE + 19, 190, 3, 370); }
  // keukenmuur + tegels
  ctx.fillStyle = P.wall; ctx.fillRect(0, 0, CW, 112);
  ctx.fillStyle = P.tile; for (let x = 0; x < CW; x += 20) for (let y = 0; y < 44; y += 20) if ((x + y) / 20 % 2) ctx.fillRect(x, y, 20, 20);
  // bonnetjes
  R.tickets.slice(0, 7).forEach((k, i) => {
    const x = 6 + i * 50, d = dish(k.dish), n = d.steps.length;
    ctx.fillStyle = "#fffdf6"; rr(x, 4, 46, 34, 5); ctx.fill(); ctx.fillStyle = k.state === "pass" ? "#10b981" : "#f59e0b"; ctx.fillRect(x, 4, 46, 4);
    plate(x + 14, 22, d, .7);
    for (let s = 0; s < n; s++) circ(x + 32 + s * 7 - (n - 1) * 3, 22, 2.6, s < k.step || k.state === "pass" ? "#10b981" : s === k.step && k.state === "busy" ? "#f59e0b" : "#d4d4d8");
  });
  // aanrecht
  ctx.fillStyle = "#b9c0ca"; rr(4, 44, CW - 8, 66, 8); ctx.fill(); ctx.fillStyle = "#d7dce3"; rr(4, 44, CW - 8, 10, 6); ctx.fill();
  for (const s of R.stations) drawStation(s, T);
  for (const sm of R.smoke){ ctx.globalAlpha = .55 * (1 - sm.t / 1.2); circ(sm.x, sm.y - sm.t * 40, 5 + sm.t * 8, "#6b7280"); ctx.globalAlpha = 1; }
  // kok
  person(R.chef, {shirt:"#f8fafc", skin:"#e0a77a", hair:"#2b1d14", hat:true, apron:false, legs:"#334155", mood:"happy"});
  // doorgeefluik
  ctx.fillStyle = P.pass; rr(16, 140, CW - 32, 22, 6); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(20, 142, CW - 40, 4);
  R.pass.forEach(k => { if (!k.w || k.w.ph === "pick") plate(passX(k), 150, dish(k.dish)); });
  // decor
  const plant = (x, y) => { ctx.fillStyle = "#b45f3c"; rr(x - 9, y - 4, 18, 16, 3); ctx.fill(); circ(x - 6, y - 10, 8, "#2f9e5b"); circ(x + 6, y - 10, 8, "#2f9e5b"); circ(x, y - 18, 9, "#3cb371"); };
  if (S.up.decor >= 1){ plant(18, 196); plant(342, 196); }
  if (S.up.decor >= 2){ plant(18, 520); plant(342, 520); }
  // deur
  ctx.fillStyle = "#6b4a2f"; ctx.fillRect(AISLE - 34, CHH - 8, 68, 8); ctx.fillStyle = "#8b5a3c"; ctx.fillRect(AISLE - 28, CHH - 18, 56, 10);
  // tafels + zittende gasten
  const seated = new Set();
  R.tables.forEach(t => {
    const g = t.g && guestById(t.g);
    ctx.fillStyle = "#8b5a3c"; rr(t.x - 13, t.y - 40, 26, 14, 4); ctx.fill(); // stoel
    if (g && !g.path.length && g.state !== "out"){ seated.add(g); drawGuest(g, true, T); }
    ell(t.x, t.y + 22, 40, 8, "rgba(0,0,0,.15)");
    ctx.fillStyle = R.pi === 1 ? "#5e321c" : "#d6cfc0"; rr(t.x - 38, t.y - 14, 76, 32, 9); ctx.fill();
    ctx.fillStyle = P.table; rr(t.x - 38, t.y - 18, 76, 30, 9); ctx.fill();
    if (R.pi === 2){ ctx.fillStyle = "#f5b301"; circ(t.x + 26, t.y - 8, 3, "#fde68a"); }
    if (g && g.state === "eat") plate(t.x, t.y - 4, dish(g.dish), 1.1);
    if (t.cash){
      const pulse = 1 + Math.sin(T * 6) * .06;
      for (let i = 0; i < 3; i++){ ell(t.x + 18, t.y - 2 - i * 3, 9 * pulse, 4.5 * pulse, "#e0a800"); ell(t.x + 18, t.y - 3 - i * 3, 8 * pulse, 3.6 * pulse, "#fcd34d"); }
      ctx.fillStyle = "#7c4a03"; ctx.font = "800 12px system-ui"; ctx.textAlign = "center"; ctx.fillText("€" + t.cash, t.x - 10, t.y + 2);
    }
  });
  // lopende mensen, gesorteerd op diepte
  const walkers = [...R.guests.filter(g => !seated.has(g)).map(g => ({y:g.y, f:() => drawGuest(g, false, T)})),
    ...R.waiters.map(w => ({y:w.y, f:() => person(w, {shirt:"#1f2937", skin:"#c68654", hair:"#1c1c1c", bow:true, legs:"#111827", carry:w.carry, mood:"happy"})}))];
  walkers.sort((a, b) => a.y - b.y).forEach(o => o.f());
  // zwevende teksten
  for (const p of R.pops){
    ctx.globalAlpha = 1 - p.t / 1.4; ctx.font = "800 15px system-ui"; ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.strokeText(p.txt, p.x, p.y - p.t * 30); ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y - p.t * 30); ctx.globalAlpha = 1;
  }
}
function drawGuest(g, seated, T){
  const ty = GTYPE[g.type];
  const mood = g.state === "eat" || g.state === "out" && g.pat > 0 ? "happy" : g.pat < .3 ? "angry" : "neutral";
  person(g, {shirt:g.type === "vip" ? "#7c3aed" : g.type === "critic" ? "#334155" : g.shirt, skin:g.skin, hair:g.hair, seated, crown:g.type === "vip", glasses:g.type === "critic", mood});
  if (!seated) return;
  const bx = g.x, by = g.y - 68;
  if (g.state === "order"){
    const s = 1 + Math.sin(T * 5) * .05; bubble(bx, by, 30 * s, 26 * s);
    ctx.fillStyle = "#7c3aed"; ctx.font = "900 18px system-ui"; ctx.textAlign = "center"; ctx.fillText("!", bx, by - 7);
  } else if (g.state === "food"){
    bubble(bx, by, 34, 26); plate(bx, by - 12, dish(g.dish), .8);
  } else if (g.state === "eat"){
    bubble(bx, by, 26, 22); ctx.fillStyle = "#ec4899"; ctx.font = "900 14px system-ui"; ctx.textAlign = "center"; ctx.fillText("♥", bx, by - 6);
  }
  if (g.state === "order" || g.state === "food"){
    ctx.fillStyle = "rgba(0,0,0,.18)"; rr(bx - 17, by + 9, 34, 5, 3); ctx.fill();
    ctx.fillStyle = g.pat < .3 ? "#ef4444" : g.pat < .6 ? "#f59e0b" : "#22c55e"; rr(bx - 17, by + 9, 34 * Math.max(0, g.pat), 5, 3); ctx.fill();
  }
  if (ty.label){ ctx.font = "800 9px system-ui"; ctx.textAlign = "center"; const w = ctx.measureText(ty.label).width + 8;
    ctx.fillStyle = g.type === "vip" ? "#7c3aed" : g.type === "critic" ? "#334155" : "#dc2626"; rr(bx - w / 2, g.y - 4, w, 13, 6); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillText(ty.label, bx, g.y + 6); }
}
function drawStation(s, T){
  const x = s.x, y = 78;
  ctx.globalAlpha = s.owned ? 1 : .35;
  if (s.type === "fogon"){ ctx.fillStyle = "#2f343b"; rr(x - 24, y - 26, 48, 48, 8); ctx.fill(); ctx.strokeStyle = "#555c66"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - 2, 15, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y - 2, 8, 0, 7); ctx.stroke(); }
  else if (s.type === "tabla"){ ctx.fillStyle = "#c08a4e"; rr(x - 24, y - 20, 48, 36, 7); ctx.fill(); ctx.fillStyle = "#d9a86a"; rr(x - 20, y - 16, 40, 28, 5); ctx.fill(); }
  else { ctx.fillStyle = "#4b5563"; rr(x - 25, y - 28, 50, 52, 8); ctx.fill(); ctx.fillStyle = s.job && s.job.st === "cook" ? "#f59e0b" : "#1f2937"; rr(x - 17, y - 16, 34, 26, 5); ctx.fill(); ctx.fillStyle = "#9ca3af"; ctx.fillRect(x - 14, y - 24, 28, 4); }
  ctx.globalAlpha = 1;
  ctx.font = "700 9px system-ui"; ctx.textAlign = "center"; ctx.fillStyle = "#334155"; ctx.fillText(s.owned ? stName(s.type) : "op slot", x, y + 32);
  const j = s.job; if (!j) return;
  const d = dish(j.tk.dish);
  if (s.type === "fogon"){ circ(x, y - 2, 16, "#4b5563"); ctx.fillStyle = "#4b5563"; ctx.fillRect(x + 14, y - 4, 12, 4); }
  if (s.type !== "horno") { ell(x, y - 2, 11, 8, j.st === "ready" && j.bt > 6.5 ? "#3f2a1d" : d.c); circ(x - 4, y - 4, 2, d.c2); circ(x + 4, y, 2, d.c2); }
  if (s.type === "tabla" && j.st === "cook"){ const k = Math.sin(T * 16) * 4; ctx.fillStyle = "#cbd5e1"; ctx.fillRect(x + 6, y - 14 + k, 12, 3); ctx.fillStyle = "#111"; ctx.fillRect(x + 16, y - 14 + k, 6, 3); }
  if (j.st === "cook") ring(x, y - 2, 21, j.t / j.dur, "#f59e0b");
  else {
    const danger = ST[s.type].burn && j.bt > 5, flash = danger && Math.sin(T * 14) > 0;
    ring(x, y - 2, 21, 1, flash ? "#ef4444" : "#22c55e", 5);
    circ(x + 17, y - 22, 8, danger ? "#ef4444" : "#22c55e"); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.2; ctx.beginPath();
    if (danger){ ctx.moveTo(x + 17, y - 26); ctx.lineTo(x + 17, y - 21); ctx.moveTo(x + 17, y - 18.5); ctx.lineTo(x + 17, y - 18); } else { ctx.moveTo(x + 13.5, y - 22); ctx.lineTo(x + 16, y - 19.5); ctx.lineTo(x + 20.5, y - 25); }
    ctx.stroke();
  }
}

// =================== INVOER ===================
$("#stage").addEventListener("click", e => {
  if (mode !== "game") return;
  const t = e.target.closest("[data-act],[data-opt],[data-buy],[data-dish],[data-lvl]"); if (!t) return;
  if (t.dataset.opt !== undefined) return answer(+t.dataset.opt);
  if (t.dataset.lvl !== undefined) return openLevel(+t.dataset.lvl);
  if (t.dataset.buy) return buy(t.dataset.buy);
  if (t.dataset.dish) return buyDish(t.dataset.dish);
  const a = t.dataset.act;
  if (a === "mute"){ S.mute = !S.mute; save(); t.innerHTML = SOUND(!S.mute); t.setAttribute("aria-label", S.mute ? "Geluid aan" : "Geluid uit"); }
  else if (a === "quit" || a === "map") startGame();
  else if (a === "close" && e.target === t && R && R.sheet && R.sheet.picked === null){ R.sheet = null; drawSheet(); lastT = performance.now(); }
});
document.addEventListener("keydown", e => {
  if (mode !== "game" || !R) return;
  if (R.sheet && "1234".includes(e.key) && e.key) answer(+e.key - 1);
  else if (R.sheet && e.key === "Escape" && R.sheet.picked === null){ R.sheet = null; drawSheet(); }
});

renderDir(); start();
</script>
