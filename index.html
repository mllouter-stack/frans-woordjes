<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaans Woordjes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7ff; --card:#ffffff; --text:#0f172a; --muted:#475569; --border:#e9e1fa;
  --primary:#7c3aed; --on-primary:#ffffff; --primary-soft:#f1eafe;
  --good:#047857; --good-soft:#e3f5ee; --bad:#b91c1c; --bad-soft:#fdeaea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111a; --card:#1e1b27; --text:#f1eef7; --muted:#b3adc2; --border:#332d42;
    --primary:#a78bfa; --on-primary:#160f2b; --primary-soft:#2a2340;
    --good:#4ade80; --good-soft:#173324; --bad:#f87171; --bad-soft:#3b1a1a;
  }
}
:root[data-theme="dark"]{
  --bg:#13111a; --card:#1e1b27; --text:#f1eef7; --muted:#b3adc2; --border:#332d42;
  --primary:#a78bfa; --on-primary:#160f2b; --primary-soft:#2a2340;
  --good:#4ade80; --good-soft:#173324; --bad:#f87171; --bad-soft:#3b1a1a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button{border:0;background:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:20px}
.head{font-family:"Baloo 2",system-ui,sans-serif}

/* bovenbalk: hoofdstuk + richting */
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{font-family:"Baloo 2",sans-serif;font-size:26px;line-height:1;margin:0 auto 0 0}
select,.pill{height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:15px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--primary-soft);padding:4px;border-radius:14px}
.tabs button{height:44px;border-radius:10px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:9px;background:var(--border);overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;background:var(--primary);transition:width .3s ease-out}

/* kaart */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:20px;min-height:280px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;width:100%}
.q,.a,.ex{display:block}
.q{font-family:"Baloo 2",sans-serif;font-size:clamp(32px,9vw,44px);line-height:1.1;margin:0}
.a{font-family:"Baloo 2",sans-serif;font-size:clamp(24px,7vw,32px);line-height:1.15;color:var(--primary);margin:0;animation:in .25s ease-out}
.ex{color:var(--muted);font-size:15px;max-width:420px;margin:4px 0 0;animation:in .25s ease-out}
.ex b{color:var(--text)}
.tap{color:var(--muted);font-size:15px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{height:56px;border-radius:14px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.main{grid-column:1/-1;background:var(--primary);color:var(--on-primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn svg{flex:none}

/* 4 keuzes */
#card{min-height:200px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{min-height:56px;padding:10px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:17px;font-weight:600;text-align:left;display:flex;align-items:center;gap:12px;transition:background .2s,border-color .2s,opacity .2s}
.opt:not(:disabled):hover{border-color:var(--primary)}
.opt:not(:disabled):active{transform:scale(.98)}
.opt .num{flex:none;width:24px;height:24px;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:13px;display:grid;place-items:center}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}

/* koppelen */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{min-height:60px;padding:8px 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:16px;font-weight:600;line-height:1.25;transition:background .2s,border-color .2s,opacity .25s}
.tile.sel{border-color:var(--primary);background:var(--primary-soft)}
.tile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.45;cursor:default}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}

/* einde */
.end h2{font-family:"Baloo 2",sans-serif;font-size:32px;margin:0}
.end p{margin:0;color:var(--muted)}
.miss{list-style:none;padding:0;margin:8px 0 0;width:100%;max-width:360px;text-align:left}
.miss li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:15px}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- restaurant ---------- */
:root{--coin:#b45309;--coin-soft:#fef3c7;--wood:#f5ebdd;--wood-line:#eadbc5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--coin:#fbbf24;--coin-soft:#3a2c0e;--wood:#221d2b;--wood-line:#262030}}
:root[data-theme="dark"]{--coin:#fbbf24;--coin-soft:#3a2c0e;--wood:#221d2b;--wood-line:#262030}
.resto{display:flex;flex-direction:column;gap:10px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud .name{font-family:"Baloo 2",sans-serif;font-size:20px;line-height:1.1;margin-right:auto}
.hud .name small{display:block;white-space:nowrap;font:600 13px system-ui,sans-serif;color:var(--muted)}
.chip{height:34px;padding:0 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--border);display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chip.coin{color:var(--coin);background:var(--coin-soft);border-color:transparent}
.chip.combo{color:var(--primary);background:var(--primary-soft);border-color:transparent}
.stars{display:inline-flex;gap:1px;color:var(--coin)}
.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 -4px}
.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;border-radius:20px;background:var(--wood);background-image:repeating-linear-gradient(90deg,transparent 0 46px,var(--wood-line) 46px 48px)}
.seat{position:relative;min-width:0;min-height:122px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:8px 6px 10px;text-align:center;transition:border-color .2s,transform .1s}
.seat.empty{background:transparent;border-style:dashed;color:var(--muted);justify-content:center;font-size:14px}
.seat.ask{border-color:var(--primary);cursor:pointer}
.seat.ask:active{transform:scale(.97)}
.seat.ask .bub{background:var(--primary);color:var(--on-primary)}
.seat.ask .bub::after{border-top-color:var(--primary)}
.bub{position:relative;max-width:100%;padding:5px 8px;border-radius:12px;background:var(--primary-soft);font-weight:700;font-size:14px;line-height:1.2;margin-bottom:6px;word-break:break-word}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--primary-soft)}
.bub small{display:block;font-weight:600;font-size:11px;opacity:.8}
.pat{width:100%;height:6px;border-radius:9px;background:var(--border);overflow:hidden}
.pat i{display:block;height:100%;background:var(--good);transition:background .3s}
.pat i.mid{background:var(--coin)}
.pat i.low{background:var(--bad)}
.pop{position:absolute;top:8px;right:10px;font-weight:800;color:var(--coin);animation:up 1.2s ease-out forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-24px)}}
.kitchen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stove{min-height:96px;border-radius:16px;background:var(--card);border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 8px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.stove.locked{border-style:dashed;opacity:.55}
.stove.ready{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:pointer;animation:glow 1s ease-in-out infinite alternate}
.stove.ready:active{transform:scale(.97)}
@keyframes glow{to{box-shadow:0 0 0 4px var(--good-soft)}}
.orders{font-size:14px;color:var(--muted);min-height:20px}
.sheetbg{position:fixed;inset:0;background:rgba(15,10,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:rise .2s ease-out}
.sheet .q{text-align:center;margin:4px 0 2px}
.sheet .hint{text-align:center;color:var(--muted);font-size:14px;margin:0}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px)}}
.shop{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1.5px solid var(--border)}
.item .txt{flex:1;min-width:0}
.item b{display:block;font-size:16px}
.item span{display:block;font-size:13px;color:var(--muted)}
.buy{min-width:84px;height:44px;border-radius:12px;background:var(--coin-soft);color:var(--coin);font-weight:800;padding:0 12px;flex:none}
.buy:disabled{opacity:.45;cursor:default}
.buy.max{background:var(--good-soft);color:var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{background:var(--primary-soft);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:"Baloo 2",sans-serif;font-size:24px;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>Spaans woordjes</h1>
    <label class="sr" for="chap" style="position:absolute;left:-9999px">Hoofdstuk</label>
    <select id="chap">
      <option value="all">Examen 1 + 2</option>
      <option value="1">Examen 1</option>
      <option value="2">Examen 2</option>
    </select>
    <button class="pill" id="dir" aria-label="Wissel richting"></button>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tCards" aria-selected="true">Kaarten</button>
    <button role="tab" id="tMatch" aria-selected="false">Koppelen</button>
    <button role="tab" id="tGame" aria-selected="false">Restaurant</button>
  </div>

  <section id="play">
    <div class="meta"><span id="mLeft"></span><span id="mRight"></span></div>
    <div class="track"><i id="bar"></i></div>
  </section>

  <div id="stage"></div>
</main>

<script>
// [spaans, nederlands] — Todo bajo control, examen 1 en 2
const CH = {
1: {name:"Examen 1", groups:[
 ["Zelfstandige naamwoorden", [
  ["el agua","het water"],["el café / el té","de koffie / de thee"],["la concentración","de concentratie"],["el queso","de kaas"],
  ["el ejercicio","de oefening"],["el bolígrafo","de pen"],["el libro","het boek"],["la pregunta","de vraag"],
  ["la respuesta","het antwoord"],["la mesa","de tafel"]]],
 ["Bijvoeglijke naamwoorden", [
  ["caliente","warm"],["frío","koud"],["grande","groot"],["pequeño","klein"],["nuevo","nieuw"],["viejo","oud"],
  ["molesto","irritant"],["lógico","logisch"]]],
 ["Werkwoorden", [
  ["abrir","openen"],["beber","drinken"],["buscar","zoeken"],["cantar","zingen"],["comer","eten"],["comprar","kopen"],
  ["comprender","begrijpen"],["escuchar","luisteren"],["escribir","schrijven"],["estudiar","studeren"],["hablar","spreken"],
  ["leer","lezen"],["mirar","kijken"],["necesitar","nodig hebben"],["responder","antwoorden"],["tocar (música)","spelen (muziek)"],
  ["trabajar","werken"],["subir","posten / uploaden"],["viajar","reizen"],["vivir","leven / wonen"]]],
 ["Bijwoorden", [
  ["mucho","veel"],["poco","weinig"],["bien","goed"],["genial","geniaal"],["mal","slecht"],["fatal","fataal"]]],
 ["Voegwoorden", [
  ["también","ook"],["tampoco","ook niet"],["hacia","naar"],["con","met"],["de","van"],["en / sobre / a","in / op / bij"],
  ["o","of"],["pero","maar"],["y","en"]]],
 ["Super handig", [
  ["hola","hallo"],["adiós","dag"],["bienvenido","welkom"],["encantado/a","aangenaam"],["buenos días","goedemorgen"],
  ["buenas tardes","goedemiddag"],["buenas noches","goedenavond"],["¿qué significa…?","wat betekent…?"],["por favor","alsjeblieft (aub)"],
  ["gracias / de nada","bedankt / geen dank"],["lo siento","sorry"]]]
]},
2: {name:"Examen 2", groups:[
 ["De kleuren", [
  ["amarillo","geel"],["azul","blauw"],["blanco","wit"],["gris","grijs"],["marrón","bruin"],["negro","zwart"],
  ["rojo","rood"],["rosa","roze"],["verde","groen"],["violeta","violet"]]],
 ["De kapper", [
  ["el cabello blanco","het witte haar"],["el cabello castaño","het bruine haar"],["el cabello oscuro","het donkere haar"],
  ["el cabello rojo","het rode haar"],["el cabello rubio","het blonde haar"]]],
 ["De kledingwinkel", [
  ["el traje de baño","het badpak"],["el bikini","de bikini"],["la bufanda","de sjaal"],["el calcetín","de sok"],
  ["la camiseta","het t-shirt"],["la chancla","de slipper"],["el cinturón","de riem"],["la falda","de rok"],
  ["el suéter","de trui"],["las gafas de sol","de zonnebril"],["los pantalones","de (spijker)broek"],["el sombrero","de hoed"],
  ["el vestido","de jurk"],["el zapato (de tacón)","de schoen (met hak)"],["la vendedora","de verkoopster"],["el/la modelo","het model"]]],
 ["Lichaamsdelen", [
  ["la boca","de mond"],["el brazo","de arm"],["el cuello","de nek"],["el dedo del pie","de teen"],["el dedo","de vinger"],
  ["el diente","de tand"],["la mano","de hand"],["la nariz","de neus"],["el ojo","het oog"],["la oreja","het oor"],
  ["el pie","de voet"],["la pierna","het been"]]],
 ["De week", [
  ["lunes","maandag"],["martes","dinsdag"],["miércoles","woensdag"],["jueves","donderdag"],["viernes","vrijdag"],
  ["el fin de semana","het weekend"],["sábado","zaterdag"],["domingo","zondag"]]],
 ["Werkwoorden", [["ser","zijn"],["valer","kosten"]]],
 ["Vraagwoorden", [
  ["cómo","hoe"],["cuál","welke"],["cuándo","wanneer"],["cuánto","hoeveel"],["de dónde","van waar"],["dónde","waar"],
  ["por qué","waarom"],["qué","wat"],["quién","wie"]]]
]}
};


const WORDS = [];
for (const [ch, c] of Object.entries(CH)) for (const [grp, list] of c.groups)
  for (const [f, n, ex] of list) WORDS.push({ch, grp, f, n, ex});

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ICON = {
  x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>',
  swap: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>'
};

let chap = "all", fr2nl = true, mode = "cards";
const pool = () => WORDS.filter(w => chap === "all" || w.ch === chap);
const Q = w => fr2nl ? w.f : w.n, A = w => fr2nl ? w.n : w.f;

function setMeta(left, right, pct){ $("#mLeft").textContent = left; $("#mRight").textContent = right; $("#bar").style.width = pct + "%"; }
function start(){ $("#play").classList.remove("hidden"); stopGame(); mode === "cards" ? startCards() : mode === "match" ? startMatch() : startGame(); }

$("#chap").onchange = e => { chap = e.target.value; start(); };
function renderDir(){ $("#dir").innerHTML = (fr2nl ? "ES → NL " : "NL → ES ") + ICON.swap; }
$("#dir").onclick = () => { fr2nl = !fr2nl; renderDir(); start(); };
const TABS = [["#tCards","cards"],["#tMatch","match"],["#tGame","game"]];
for (const [id, m] of TABS)
  $(id).onclick = () => { mode = m; for (const [i, x] of TABS) $(i).setAttribute("aria-selected", x === m); start(); };

// ---------- kaarten ----------
const BLOCK = 10;
let queue, cur, opts, picked, total, done, missed, blocks, bi, bDone, bMissed;
function startCards(){
  const p = shuffle(pool()); total = p.length; done = 0; missed = new Set();
  blocks = [];
  for (let i = 0; i < p.length; i += BLOCK) blocks.push(p.slice(i, i + BLOCK));
  if (blocks.length > 1 && blocks.at(-1).length < 5) blocks.at(-2).push(...blocks.pop()); // geen mini-blokje aan het eind
  bi = 0; startBlock();
}
// een blok is pas klaar als je elk woord 3x achter elkaar goed hebt; een fout zet de teller van dat woord terug op 0
const STREAK = 3;
let streak;
function startBlock(){ queue = shuffle(blocks[bi]); bDone = 0; bMissed = new Set(); streak = new Map(); next(); }
function next(){
  if (!queue.length) return blockEnd();
  cur = queue.shift(); picked = null; opts = choices(cur); drawCard();
}
// 3 foute keuzes: eerst uit dezelfde groep (lijkt meer op elkaar), dan uit de rest; nooit dezelfde tekst als het goede antwoord
function choices(w){
  const seen = new Set([A(w)]), out = [A(w)];
  const others = [...shuffle(WORDS.filter(x => x.grp === w.grp && x.ch === w.ch)), ...shuffle(WORDS.filter(x => x.ch === w.ch)), ...shuffle(WORDS)];
  for (const x of others){ if (out.length === 4) break; if (!seen.has(A(x))){ seen.add(A(x)); out.push(A(x)); } }
  return shuffle(out);
}
function drawCard(){
  setMeta("Blok " + (bi + 1) + " van " + blocks.length + " · " + bDone + "/" + blocks[bi].length + " goed",
    bMissed.size ? bMissed.size + " fout" : "", [...streak.values()].reduce((a, b) => a + b, 0) / (blocks[bi].length * STREAK) * 100);
  const answered = picked !== null, right = A(cur);
  $("#stage").innerHTML = `
    <div class="card" id="card">
      <span class="q">${esc(Q(cur))}</span>
      ${answered ? (cur.ex ? `<span class="ex">${esc(cur.ex).replace(/\[(.+?)\]/g, "<b>$1</b>")}</span>` : `<span class="a">${esc(A(cur))}</span>`) : `<span class="tap">Kies de goede vertaling</span>`}
    </div>
    <div class="opts" role="group" aria-label="Antwoorden">
      ${opts.map((o, i) => {
        const cls = !answered ? "" : o === right ? "ok" : o === picked ? "no" : "dim";
        const ico = cls === "ok" ? ICON.check : cls === "no" ? ICON.x : `<span class="num" aria-hidden="true">${i + 1}</span>`;
        return `<button class="opt ${cls}" data-o="${esc(o)}" ${answered ? "disabled" : ""}>${ico}<span>${esc(o)}</span></button>`;
      }).join("")}
    </div>
    ${answered ? `<div class="btns" style="margin-top:16px"><button class="btn main" id="nextBtn">Volgende</button></div>` : ""}`;
  if (answered){ $("#nextBtn").onclick = grade; $("#nextBtn").focus({preventScroll:true}); }
  else document.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(b.dataset.o));
}
function choose(o){ if (picked === null){ picked = o; drawCard(); } }
function grade(){
  if (picked === A(cur)){
    const s = (streak.get(cur) || 0) + 1; streak.set(cur, s);
    if (s >= STREAK){ done++; bDone++; }
    else queue.splice(Math.min(queue.length, 4 + (Math.random() * 3 | 0)), 0, cur); // later in het blok nog eens
  } else {
    streak.set(cur, 0); missed.add(cur); bMissed.add(cur);
    queue.splice(Math.min(queue.length, 3), 0, cur); // komt snel terug
  }
  next();
}
function blockEnd(){
  if (bi === blocks.length - 1) return end();
  const m = [...bMissed];
  setMeta("Blok " + (bi + 1) + " van " + blocks.length + " klaar", "", 100);
  $("#stage").innerHTML = `<div class="card end">
    <h2>Blok ${bi + 1} klaar</h2>

  </div>
  <div class="btns" style="margin-top:16px">
    <button class="btn main" id="nextBlock">Volgende ${blocks[bi + 1].length} woorden</button>
    ${m.length ? `<button class="btn soft" id="redo" style="grid-column:1/-1">Dit blok nog een keer</button>` : ""}
  </div>`;
  $("#nextBlock").onclick = () => { bi++; startBlock(); };
  if (m.length) $("#redo").onclick = startBlock;
  $("#nextBlock").focus({preventScroll:true});
}
function end(){
  const m = [...missed];
  setMeta(total + " van " + total + " gekend", "", 100);
  $("#stage").innerHTML = `<div class="card end">
    <h2>${m.length ? "Klaar" : "Alles goed"}</h2>
    <p>${m.length ? `Deze ${m.length} woorden waren lastig:` : "Je kende alle " + total + " woorden in één keer."}</p>
    ${m.length ? `<ul class="miss">${m.map(w => `<li><b>${esc(w.f)}</b><span>${esc(w.n)}</span></li>`).join("")}</ul>` : ""}
  </div>
  <div class="btns" style="margin-top:16px"><button class="btn main" id="again">Opnieuw</button></div>`;
  $("#again").onclick = start;
}

// ---------- koppelen ----------
const PER = 5;
let rounds, ri, errors, sel, left;
function startMatch(){
  // geen dubbele vertalingen in één ronde (bv. twee keer 'kortom')
  rounds = [];
  for (const w of shuffle(pool())){
    let r = rounds.find(r => r.length < PER && !r.some(x => x.n === w.n || x.f === w.f));
    if (!r) rounds.push(r = []);
    r.push(w);
  }
  rounds = rounds.filter(r => r.length > 1); ri = 0; errors = 0; drawRound();
}
function drawRound(){
  const r = rounds[ri]; left = r.length; sel = null;
  setMeta("Ronde " + (ri + 1) + " van " + rounds.length, errors ? errors + " fout" : "", ri / rounds.length * 100);
  const tile = (w, side) => `<button class="tile" data-i="${r.indexOf(w)}" data-s="${side}">${esc(side === "q" ? Q(w) : A(w))}</button>`;
  $("#stage").innerHTML = `<div class="grid"><div class="col">${shuffle(r).map(w => tile(w, "q")).join("")}</div><div class="col">${shuffle(r).map(w => tile(w, "a")).join("")}</div></div>`;
  document.querySelectorAll(".tile").forEach(t => t.onclick = () => pick(t));
}
function pick(t){
  if (t.classList.contains("ok")) return;
  if (!sel || sel.dataset.s === t.dataset.s){
    sel?.classList.remove("sel");
    sel = sel === t ? null : t; sel?.classList.add("sel");
    return;
  }
  const a = sel; sel = null; a.classList.remove("sel");
  if (a.dataset.i === t.dataset.i){
    a.classList.add("ok"); t.classList.add("ok"); a.disabled = t.disabled = true;
    if (--left === 0) setTimeout(() => ++ri < rounds.length ? drawRound() : matchEnd(), 400);
  } else {
    errors++; setMeta("Ronde " + (ri + 1) + " van " + rounds.length, errors + " fout", ri / rounds.length * 100);
    for (const x of [a, t]){ x.classList.remove("no"); void x.offsetWidth; x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 400); }
  }
}
function matchEnd(){
  setMeta("Alle rondes klaar", "", 100);
  $("#stage").innerHTML = `<div class="card end"><h2>${errors ? "Klaar" : "Alles goed"}</h2>
    <p>${errors ? errors + " keer fout gekoppeld." : "Geen enkele fout."}</p></div>
    <div class="btns" style="margin-top:16px"><button class="btn main" id="again">Opnieuw</button></div>`;
  $("#again").onclick = start;
}

document.addEventListener("keydown", e => {
  if (mode !== "cards" || !cur || !$("#card")) return;
  if (picked === null && "1234".includes(e.key) && e.key) choose(opts[+e.key - 1]);
});

const DISHES = [

const SKIN = ["#f1c7a5", "#e0a77a", "#c68654", "#8d5a3b", "#5e3b28"], HAIR = ["#2b1d14", "#6b4226", "#d9a441", "#a33b20", "#1c1c1c", "#8a8a8a"];
const SAVEKEY = "micocina-v1";

let S = load(), R = null, raf = 0, lastT = 0, gid = 0;
function fresh(){ return {coins:0, tables:2, stoves:1, chef:0, decor:0, waiter:0, menu:["tortilla","gazpacho"], rating:3, day:{all:0,"1":0,"2":0}, days:0}; }
function load(){ try { const s = JSON.parse(localStorage.getItem(SAVEKEY)); if (s && s.menu) return Object.assign(fresh(), s); } catch(e){} return fresh(); }
function save(){ try { localStorage.setItem(SAVEKEY, JSON.stringify(S)); } catch(e){} }

const STAR = f => `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.8z" fill="${f ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
const COIN = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor" opacity=".25"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 010 3h-3a1.5 1.5 0 000 3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const stars = r => `<span class="stars" aria-label="${r.toFixed(1)} sterren">${[1,2,3,4,5].map(i => STAR(r >= i - .5)).join("")}</span>`;
function face(g, mood){
  const m = mood === "happy" ? "M17 30q7 6 14 0" : mood === "angry" ? "M17 33q7-5 14 0" : "M18 31h12";
  const brow = mood === "angry" ? '<path d="M15 19l6 2M33 19l-6 2" stroke="#3a2a20" stroke-width="2" stroke-linecap="round"/>' : "";
  return `<svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="17" fill="${g.skin}"/><path d="M7 24a17 17 0 0134 0q-6-9-17-9T7 24z" fill="${g.hair}"/>${brow}<circle cx="18" cy="25" r="2.2" fill="#2a1d16"/><circle cx="30" cy="25" r="2.2" fill="#2a1d16"/><path d="${m}" fill="none" stroke="#2a1d16" stroke-width="2.2" stroke-linecap="round"/></svg>`;
}
const dishSvg = (d, s = 44) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="30" rx="21" ry="12" fill="#e7e5ef"/><ellipse cx="24" cy="29" rx="15" ry="8" fill="#fff"/><ellipse cx="24" cy="26" rx="11" ry="7" fill="${d.c}"/><circle cx="20" cy="24" r="2" fill="${d.c2}"/><circle cx="27" cy="27" r="2" fill="${d.c2}"/><circle cx="26" cy="22" r="1.6" fill="${d.c2}"/></svg>`;
const dish = id => DISHES.find(d => d.id === id);
const lvl = k => S[k] - UPG[k].base;
const tierName = () => TIERS[S.tables] || TIERS.at(-1);
const gameBlocks = () => { const p = pool(), b = []; for (let i = 0; i < p.length; i += BLOCK) b.push(p.slice(i, i + BLOCK)); if (b.length > 1 && b.at(-1).length < 5) b.at(-2).push(...b.pop()); return b; };

function stopGame(){ cancelAnimationFrame(raf); raf = 0; R = null; }
function startGame(){ stopGame(); lobby(); }

function hud(){
  return `<div class="hud"><div class="name">Mi Cocina<small>${tierName()} · dag ${S.days + 1}</small></div>
    <span class="chip coin">${COIN}<span id="gCoins">${S.coins}</span></span>
    <span class="chip">${stars(S.rating)}</span>${R ? `<span class="chip combo" id="gCombo">x${combo().toFixed(1)}</span>` : ""}</div>`;
}
function lobby(msg = ""){
  const b = gameBlocks(), di = S.day[chap] % b.length;
  setMeta("Blok " + (di + 1) + " van " + b.length, b[di].length + " woorden vandaag", 0);
  $("#stage").innerHTML = `<div class="resto">${hud()}${msg}

    <p class="tap" style="margin:0">Gasten bestellen met een woord. Kies de goede vertaling om de bestelling op te nemen. Daarna kook je het gerecht, serveer je het en verdien je geld. De dag is voorbij als je elk woord 3 keer achter elkaar goed hebt.</p>
    ${shopHtml()}</div>`;
}
function shopHtml(){
  const up = Object.entries(UPG).map(([k, u]) => {
    const l = lvl(k), full = S[k] >= u.max, c = u.cost[l];
    return `<div class="item"><div class="txt"><b>${u.name}</b><span>${u.desc} · nu ${S[k]}${u.base === 0 ? " / " + u.max : " (max " + u.max + ")"}</span></div>
      ${full ? `<button class="buy max" disabled>Max</button>` : `<button class="buy" data-buy="${k}" ${S.coins < c ? "disabled" : ""}>€${c}</button>`}</div>`;
  }).join("");
  const menu = DISHES.filter(d => d.cost !== undefined && d.cost > 0).map(d => {
    const have = S.menu.includes(d.id);
    return `<div class="item">${dishSvg(d, 40)}<div class="txt"><b>${d.name}</b><span>€${d.price} per bord · ${d.cook} sec koken</span></div>
      ${have ? `<button class="buy max" disabled>Op menu</button>` : `<button class="buy" data-dish="${d.id}" ${S.coins < d.cost ? "disabled" : ""}>€${d.cost}</button>`}</div>`;
  }).join("");
  return `<div class="lbl">Uitbreiden</div><div class="shop">${up}</div><div class="lbl">Menukaart</div><div class="shop">${menu}</div>`;
}

function openDay(){
  const b = gameBlocks(), di = S.day[chap] % b.length;
  R = {block:b[di], di, nb:b.length, streak:new Map(), seen:new Map(), tick:0, seats:Array(S.tables).fill(null),
       stoves:Array.from({length:S.stoves}, () => null), orders:[], spawn:.4, closing:false, sheet:null,
       earned:0, served:0, lost:0, right:0, wrong:0, missed:new Set(), cmb:0};
  lastT = performance.now(); drawGame(); raf = requestAnimationFrame(loop);
}
const combo = () => 1 + Math.min(R ? R.cmb : 0, 10) * 0.1;
const patSec = () => 30 * (1 + 0.2 * S.decor);
const cookSec = d => d.cook * (1 - 0.15 * S.chef);

function pickWord(not){
  const onFloor = new Set(R.seats.filter(g => g && g.state === "ask").map(g => g.word));
  const c = R.block.filter(w => (R.streak.get(w) || 0) < STREAK && !onFloor.has(w) && w !== not);
  if (!c.length) return null;
  c.sort((a, b) => (R.seen.get(a) ?? -99) - (R.seen.get(b) ?? -99)); // langst niet gezien eerst
  return c[Math.random() * Math.min(3, c.length) | 0];
}
function spawn(){
  const i = R.seats.indexOf(null), w = pickWord();
  if (i < 0 || !w) return;
  R.seats[i] = {id:++gid, seat:i, word:w, state:"ask", pat:1, skin:SKIN[Math.random() * 5 | 0], hair:HAIR[Math.random() * 6 | 0]};
  drawGame();
}
function loop(t){
  if (!R) return;
  const dt = Math.min(.1, (t - lastT) / 1000); lastT = t;
  if (!R.sheet) step(dt);
  raf = requestAnimationFrame(loop);
}
function step(dt){
  let dirty = false;
  if (!R.closing && (R.spawn -= dt) <= 0){ R.spawn = (2.5 + Math.random() * 3) / (0.6 + S.rating * 0.12); spawn(); }
  for (const g of R.seats) if (g){
    if (g.state === "eat"){ if ((g.eat -= dt) <= 0){ R.seats[g.seat] = null; dirty = true; } continue; }
    g.pat -= dt / patSec() * (g.state === "wait" ? 0.55 : 1);
    if (g.pat <= 0){ // gast loopt boos weg
      R.lost++; R.cmb = 0; S.rating = Math.max(1, S.rating - 0.25);
      R.seats[g.seat] = null; R.orders = R.orders.filter(o => o !== g.id);
      R.stoves = R.stoves.map(s => s && s.gid === g.id ? null : s); dirty = true; continue;
    }
    const el = document.querySelector(`[data-pat="${g.id}"]`);
    if (el){ el.style.width = g.pat * 100 + "%"; el.className = g.pat < .3 ? "low" : g.pat < .6 ? "mid" : ""; }
  }
  R.stoves.forEach((s, i) => {
    if (!s){ if (R.orders.length){ const g = R.seats.find(x => x && x.id === R.orders[0]); R.orders.shift(); if (g){ R.stoves[i] = {gid:g.id, d:g.dish, t:0, dur:cookSec(dish(g.dish)), ready:false}; dirty = true; } } return; }
    if (s.ready) return;
    s.t += dt; if (s.t >= s.dur){ s.ready = true; dirty = true; }
    const el = document.querySelector(`[data-cook="${i}"]`); if (el) el.style.width = Math.min(1, s.t / s.dur) * 100 + "%";
  });
  if (R.closing){
    R.seats.forEach((g, i) => { if (g && g.state === "ask"){ R.seats[i] = null; dirty = true; } });
    if (R.seats.every(g => !g)) return dayEnd();
  }
  if (dirty) drawGame();
}
function progress(){ return R.block.reduce((a, w) => a + Math.min(STREAK, R.streak.get(w) || 0), 0) / (R.block.length * STREAK); }
function drawGame(){
  const known = R.block.filter(w => (R.streak.get(w) || 0) >= STREAK).length;
  setMeta("Dag " + (S.days + 1) + " · blok " + (R.di + 1) + " van " + R.nb, known + "/" + R.block.length + " woorden gekend", progress() * 100);
  const seats = R.seats.map((g, i) => {
    if (!g) return `<div class="seat empty">${R.closing ? "Gesloten" : "Vrije tafel"}</div>`;
    const d = g.dish && dish(g.dish);
    const bub = g.state === "ask" ? `<div class="bub">${esc(Q(g.word))}<small>tik hier</small></div>`
      : g.state === "wait" ? `<div class="bub">${esc(d.name)}<small>wacht</small></div>`
      : `<div class="bub">¡Gracias!</div>`;
    const mood = g.state === "eat" ? "happy" : g.pat < .3 ? "angry" : "neutral";
    return `<div class="seat ${g.state}" ${g.state === "ask" ? `data-act="ask" data-id="${g.id}" role="button" tabindex="0" aria-label="Gast zegt ${esc(Q(g.word))}"` : ""}>
      ${g.pop ? `<span class="pop">+€${g.pop}</span>` : ""}${bub}${face(g, mood)}
      ${g.state !== "eat" ? `<div class="pat"><i data-pat="${g.id}" style="width:${g.pat * 100}%"></i></div>` : ""}</div>`;
  }).join("");
  const stoves = [0, 1, 2].map(i => {
    if (i >= R.stoves.length) return `<div class="stove locked">Fornuis ${i + 1}<br>nog niet gekocht</div>`;
    const s = R.stoves[i];
    if (!s) return `<div class="stove">Fornuis ${i + 1}<br>leeg</div>`;
    const d = dish(s.d);
    return s.ready ? `<button class="stove ready" data-act="serve" data-i="${i}">${dishSvg(d)}Serveer ${esc(d.name)}</button>`
      : `<div class="stove">${dishSvg(d)}${esc(d.name)}<div class="pat"><i data-cook="${i}" style="width:${s.t / s.dur * 100}%;background:var(--coin)"></i></div></div>`;
  }).join("");
  const waiting = R.orders.length ? R.orders.length + " bestelling" + (R.orders.length > 1 ? "en" : "") + " wacht op een vrij fornuis" : "";
  let sheet = "";
  if (R.sheet){
    const {g, opts, picked} = R.sheet, ans = A(g.word);
    sheet = `<div class="sheetbg" data-act="close"><div class="sheet" role="dialog" aria-label="Wat zegt de gast?">
      <p class="hint">De gast zegt:</p><div class="q">${esc(Q(g.word))}</div>
      <p class="hint">${picked === null ? "Wat betekent dat?" : picked === ans ? "¡Perfecto! Bestelling genoteerd." : "Bijna. Het goede antwoord is groen."}</p>
      <div class="opts">${opts.map((o, i) => {
        const cls = picked === null ? "" : o === ans ? "ok" : o === picked ? "no" : "dim";
        const mark = cls === "ok" ? ICON.check : cls === "no" ? ICON.x : `<span class="num">${i + 1}</span>`;
        return `<button class="opt ${cls}" data-opt="${i}" ${picked !== null ? "disabled" : ""}>${mark}${esc(o)}</button>`;
      }).join("")}</div></div></div>`;
  }
  $("#stage").innerHTML = `<div class="resto">${hud()}<div class="floor" aria-label="Eetzaal">${seats}</div>
    <div class="kitchen" aria-label="Keuken">${stoves}</div><div class="orders">${waiting}</div></div>${sheet}`;
  for (const g of R.seats) if (g) g.pop = 0;
}
function ask(id){
  const g = R.seats.find(x => x && x.id === id); if (!g || g.state !== "ask") return;
  R.sheet = {g, opts:choices(g.word), picked:null, t0:performance.now()}; drawGame();
  $(".sheet .opt")?.focus();
}
function answer(i){
  const sh = R.sheet; if (!sh || sh.picked !== null) return;
  const g = sh.g, w = g.word; sh.picked = sh.opts[i];
  R.seen.set(w, R.tick++);
  const ok = sh.picked === A(w);
  if (ok){
    R.right++; R.cmb++; R.streak.set(w, (R.streak.get(w) || 0) + 1);
    g.fast = performance.now() - sh.t0 < 4000;
    g.state = "wait"; g.pat = Math.min(1, g.pat + .3);
    g.dish = S.menu[Math.random() * S.menu.length | 0]; R.orders.push(g.id);
  } else {
    R.wrong++; R.cmb = 0; R.streak.set(w, 0); R.missed.add(w);
    g.pat = Math.max(.08, g.pat - .25);
  }
  drawGame();
  setTimeout(() => {
    if (!R || R.sheet !== sh) return;
    R.sheet = null;
    if (!ok){ const nw = pickWord(w); if (nw) g.word = nw; } // gast probeert het met een ander woord; het foute komt later terug
    if (R.block.every(x => (R.streak.get(x) || 0) >= STREAK)) R.closing = true;
    lastT = performance.now(); drawGame();
  }, ok ? 650 : 1600);
}
function serve(i){
  const s = R.stoves[i]; if (!s || !s.ready) return;
  const g = R.seats.find(x => x && x.id === s.gid); R.stoves[i] = null;
  if (g){
    const d = dish(s.d);
    const pay = Math.round(d.price * combo() * (0.6 + 0.4 * g.pat + (g.fast ? 0.2 : 0)) * (1 + 0.15 * S.waiter));
    S.coins += pay; R.earned += pay; R.served++; S.rating = Math.min(5, S.rating + 0.08);
    g.state = "eat"; g.eat = 2.2; g.pop = pay;
  }
  drawGame(); save();
}
function dayEnd(){
  cancelAnimationFrame(raf); raf = 0;
  const r = R, m = [...r.missed], lastBlock = r.di === r.nb - 1;
  S.day[chap] = (S.day[chap] || 0) + 1; S.days++; save(); R = null;
  setMeta("Dag " + S.days + " gesloten", "", 100);
  lobby(`<div class="card end" style="min-height:0;gap:14px"><h2>${lastBlock ? "Alle blokken gehaald!" : "Dag gesloten"}</h2>
    <p>Blok ${r.di + 1}: alle ${r.block.length} woorden 3 keer goed.</p>
    <div class="stats"><div><b>€${r.earned}</b><span>verdiend</span></div><div><b>${r.served}</b><span>gasten blij</span></div><div><b>${r.lost}</b><span>weggelopen</span></div></div>
    ${m.length ? `<p>Lastige woorden:</p><ul class="miss">${m.map(w => `<li><b>${esc(w.f)}</b><span>${esc(w.n)}</span></li>`).join("")}</ul>
      <button class="btn soft" data-act="redo" style="width:100%">Dit blok nog een dag oefenen</button>` : `<p>Geen enkele fout. ¡Olé!</p>`}</div>`);
}
function buy(k){
  const u = UPG[k], c = u.cost[lvl(k)];
  if (S[k] >= u.max || S.coins < c) return;
  S.coins -= c; S[k]++; save(); lobby();
}
function buyDish(id){
  const d = dish(id); if (S.menu.includes(id) || S.coins < d.cost) return;
  S.coins -= d.cost; S.menu.push(id); save(); lobby();
}
$("#stage").addEventListener("click", e => {
  if (mode !== "game") return;
  const t = e.target.closest("[data-act],[data-opt],[data-buy],[data-dish]"); if (!t) return;
  if (t.dataset.opt !== undefined) return answer(+t.dataset.opt);
  if (t.dataset.buy) return buy(t.dataset.buy);
  if (t.dataset.dish) return buyDish(t.dataset.dish);
  const a = t.dataset.act;
  if (a === "open") openDay();
  else if (a === "redo"){ S.day[chap] = Math.max(0, S.day[chap] - 1); save(); openDay(); }
  else if (a === "ask") ask(+t.dataset.id);
  else if (a === "serve") serve(+t.dataset.i);
  else if (a === "close" && e.target === t && R.sheet && R.sheet.picked === null){ R.sheet = null; lastT = performance.now(); drawGame(); }
});
document.addEventListener("keydown", e => {
  if (mode !== "game" || !R) return;
  if (R.sheet && "1234".includes(e.key) && e.key) answer(+e.key - 1);
  else if (!R.sheet && (e.key === "Enter" || e.key === " ") && e.target.dataset?.act === "ask"){ e.preventDefault(); ask(+e.target.dataset.id); }
  else if (R.sheet && e.key === "Escape" && R.sheet.picked === null){ R.sheet = null; drawGame(); }
});

renderDir(); start();
</script>
</body>
