<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaans Woordjes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7ff; --card:#ffffff; --text:#0f172a; --muted:#475569; --border:#e9e1fa;
  --primary:#7c3aed; --on-primary:#ffffff; --primary-soft:#f1eafe;
  --good:#047857; --good-soft:#e3f5ee; --bad:#b91c1c; --bad-soft:#fdeaea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111a; --card:#1e1b27; --text:#f1eef7; --muted:#b3adc2; --border:#332d42;
    --primary:#a78bfa; --on-primary:#160f2b; --primary-soft:#2a2340;
    --good:#4ade80; --good-soft:#173324; --bad:#f87171; --bad-soft:#3b1a1a;
  }
}
:root[data-theme="dark"]{
  --bg:#13111a; --card:#1e1b27; --text:#f1eef7; --muted:#b3adc2; --border:#332d42;
  --primary:#a78bfa; --on-primary:#160f2b; --primary-soft:#2a2340;
  --good:#4ade80; --good-soft:#173324; --bad:#f87171; --bad-soft:#3b1a1a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button{border:0;background:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:24px}
.head{font-family:"Baloo 2",system-ui,sans-serif}

/* bovenbalk: hoofdstuk + richting */
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{font-family:"Baloo 2",sans-serif;font-size:26px;line-height:1;margin:0 auto 0 0}
select,.pill{height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:15px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--primary-soft);padding:4px;border-radius:14px}
.tabs button{height:44px;border-radius:10px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:9px;background:var(--border);overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;background:var(--primary);transition:width .3s ease-out}

/* kaart */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:20px;min-height:280px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;width:100%}
.q,.a,.ex{display:block}
.q{font-family:"Baloo 2",sans-serif;font-size:clamp(32px,9vw,44px);line-height:1.1;margin:0}
.a{font-family:"Baloo 2",sans-serif;font-size:clamp(24px,7vw,32px);line-height:1.15;color:var(--primary);margin:0;animation:in .25s ease-out}
.ex{color:var(--muted);font-size:15px;max-width:420px;margin:4px 0 0;animation:in .25s ease-out}
.ex b{color:var(--text)}
.tap{color:var(--muted);font-size:15px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{height:56px;border-radius:14px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.main{grid-column:1/-1;background:var(--primary);color:var(--on-primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn svg{flex:none}

/* 4 keuzes */
#card{min-height:200px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{min-height:56px;padding:10px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:17px;font-weight:600;text-align:left;display:flex;align-items:center;gap:12px;transition:background .2s,border-color .2s,opacity .2s}
.opt:not(:disabled):hover{border-color:var(--primary)}
.opt:not(:disabled):active{transform:scale(.98)}
.opt .num{flex:none;width:24px;height:24px;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:13px;display:grid;place-items:center}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}

/* koppelen */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{min-height:60px;padding:8px 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:16px;font-weight:600;line-height:1.25;transition:background .2s,border-color .2s,opacity .25s}
.tile.sel{border-color:var(--primary);background:var(--primary-soft)}
.tile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.45;cursor:default}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}

/* einde */
.end h2{font-family:"Baloo 2",sans-serif;font-size:32px;margin:0}
.end p{margin:0;color:var(--muted)}
.miss{list-style:none;padding:0;margin:8px 0 0;width:100%;max-width:360px;text-align:left}
.miss li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:15px}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>Spaans woordjes</h1>
    <label class="sr" for="chap" style="position:absolute;left:-9999px">Hoofdstuk</label>
    <select id="chap">
      <option value="all">Examen 1 + 2</option>
      <option value="1">Examen 1</option>
      <option value="2">Examen 2</option>
    </select>
    <button class="pill" id="dir" aria-label="Wissel richting"></button>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tCards" aria-selected="true">Kaarten</button>
    <button role="tab" id="tMatch" aria-selected="false">Koppelen</button>
  </div>

  <section id="play">
    <div class="meta"><span id="mLeft"></span><span id="mRight"></span></div>
    <div class="track"><i id="bar"></i></div>
  </section>

  <div id="stage"></div>
</main>

<script>
// [spaans, nederlands] — Todo bajo control, examen 1 en 2
const CH = {
1: {name:"Examen 1", groups:[
 ["Zelfstandige naamwoorden", [
  ["el agua","het water"],["el café / el té","de koffie / de thee"],["la concentración","de concentratie"],["el queso","de kaas"],
  ["el ejercicio","de oefening"],["el bolígrafo","de pen"],["el libro","het boek"],["la pregunta","de vraag"],
  ["la respuesta","het antwoord"],["la mesa","de tafel"]]],
 ["Bijvoeglijke naamwoorden", [
  ["caliente","warm"],["frío","koud"],["grande","groot"],["pequeño","klein"],["nuevo","nieuw"],["viejo","oud"],
  ["molesto","irritant"],["lógico","logisch"]]],
 ["Werkwoorden", [
  ["abrir","openen"],["beber","drinken"],["buscar","zoeken"],["cantar","zingen"],["comer","eten"],["comprar","kopen"],
  ["comprender","begrijpen"],["escuchar","luisteren"],["escribir","schrijven"],["estudiar","studeren"],["hablar","spreken"],
  ["leer","lezen"],["mirar","kijken"],["necesitar","nodig hebben"],["responder","antwoorden"],["tocar (música)","spelen (muziek)"],
  ["trabajar","werken"],["subir","posten / uploaden"],["viajar","reizen"],["vivir","leven / wonen"]]],
 ["Bijwoorden", [
  ["mucho","veel"],["poco","weinig"],["bien","goed"],["genial","geniaal"],["mal","slecht"],["fatal","fataal"]]],
 ["Voegwoorden", [
  ["también","ook"],["tampoco","ook niet"],["hacia","naar"],["con","met"],["de","van"],["en / sobre / a","in / op / bij"],
  ["o","of"],["pero","maar"],["y","en"]]],
 ["Super handig", [
  ["hola","hallo"],["adiós","dag"],["bienvenido","welkom"],["encantado/a","aangenaam"],["buenos días","goedemorgen"],
  ["buenas tardes","goedemiddag"],["buenas noches","goedenavond"],["¿qué significa…?","wat betekent…?"],["por favor","alsjeblieft (aub)"],
  ["gracias / de nada","bedankt / geen dank"],["lo siento","sorry"]]]
]},
2: {name:"Examen 2", groups:[
 ["De kleuren", [
  ["amarillo","geel"],["azul","blauw"],["blanco","wit"],["gris","grijs"],["marrón","bruin"],["negro","zwart"],
  ["rojo","rood"],["rosa","roze"],["verde","groen"],["violeta","violet"]]],
 ["De kapper", [
  ["el cabello blanco","het witte haar"],["el cabello castaño","het bruine haar"],["el cabello oscuro","het donkere haar"],
  ["el cabello rojo","het rode haar"],["el cabello rubio","het blonde haar"]]],
 ["De kledingwinkel", [
  ["el traje de baño","het badpak"],["el bikini","de bikini"],["la bufanda","de sjaal"],["el calcetín","de sok"],
  ["la camiseta","het t-shirt"],["la chancla","de slipper"],["el cinturón","de riem"],["la falda","de rok"],
  ["el suéter","de trui"],["las gafas de sol","de zonnebril"],["los pantalones","de (spijker)broek"],["el sombrero","de hoed"],
  ["el vestido","de jurk"],["el zapato (de tacón)","de schoen (met hak)"],["la vendedora","de verkoopster"],["el/la modelo","het model"]]],
 ["Lichaamsdelen", [
  ["la boca","de mond"],["el brazo","de arm"],["el cuello","de nek"],["el dedo del pie","de teen"],["el dedo","de vinger"],
  ["el diente","de tand"],["la mano","de hand"],["la nariz","de neus"],["el ojo","het oog"],["la oreja","het oor"],
  ["el pie","de voet"],["la pierna","het been"]]],
 ["De week", [
  ["lunes","maandag"],["martes","dinsdag"],["miércoles","woensdag"],["jueves","donderdag"],["viernes","vrijdag"],
  ["el fin de semana","het weekend"],["sábado","zaterdag"],["domingo","zondag"]]],
 ["Werkwoorden", [["ser","zijn"],["valer","kosten"]]],
 ["Vraagwoorden", [
  ["cómo","hoe"],["cuál","welke"],["cuándo","wanneer"],["cuánto","hoeveel"],["de dónde","van waar"],["dónde","waar"],
  ["por qué","waarom"],["qué","wat"],["quién","wie"]]]
]}
};


const WORDS = [];
for (const [ch, c] of Object.entries(CH)) for (const [grp, list] of c.groups)
  for (const [f, n, ex] of list) WORDS.push({ch, grp, f, n, ex});

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ICON = {
  x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>',
  swap: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>'
};

let chap = "all", fr2nl = true, mode = "cards";
const pool = () => WORDS.filter(w => chap === "all" || w.ch === chap);
const Q = w => fr2nl ? w.f : w.n, A = w => fr2nl ? w.n : w.f;

function setMeta(left, right, pct){ $("#mLeft").textContent = left; $("#mRight").textContent = right; $("#bar").style.width = pct + "%"; }
function start(){ $("#play").classList.remove("hidden"); mode === "cards" ? startCards() : startMatch(); }

$("#chap").onchange = e => { chap = e.target.value; start(); };
function renderDir(){ $("#dir").innerHTML = (fr2nl ? "ES → NL " : "NL → ES ") + ICON.swap; }
$("#dir").onclick = () => { fr2nl = !fr2nl; renderDir(); start(); };
for (const [id, m] of [["#tCards","cards"],["#tMatch","match"]])
  $(id).onclick = () => { mode = m; $("#tCards").setAttribute("aria-selected", m === "cards"); $("#tMatch").setAttribute("aria-selected", m === "match"); start(); };

// ---------- kaarten ----------
const BLOCK = 10;
let queue, cur, opts, picked, total, done, missed, blocks, bi, bDone, bMissed;
function startCards(){
  const p = shuffle(pool()); total = p.length; done = 0; missed = new Set();
  blocks = [];
  for (let i = 0; i < p.length; i += BLOCK) blocks.push(p.slice(i, i + BLOCK));
  if (blocks.length > 1 && blocks.at(-1).length < 5) blocks.at(-2).push(...blocks.pop()); // geen mini-blokje aan het eind
  bi = 0; startBlock();
}
// een blok is pas klaar als je elk woord 3x achter elkaar goed hebt; een fout zet de teller van dat woord terug op 0
const STREAK = 3;
let streak;
function startBlock(){ queue = shuffle(blocks[bi]); bDone = 0; bMissed = new Set(); streak = new Map(); next(); }
function next(){
  if (!queue.length) return blockEnd();
  cur = queue.shift(); picked = null; opts = choices(cur); drawCard();
}
// 3 foute keuzes: eerst uit dezelfde groep (lijkt meer op elkaar), dan uit de rest; nooit dezelfde tekst als het goede antwoord
function choices(w){
  const seen = new Set([A(w)]), out = [A(w)];
  const others = [...shuffle(WORDS.filter(x => x.grp === w.grp && x.ch === w.ch)), ...shuffle(WORDS.filter(x => x.ch === w.ch)), ...shuffle(WORDS)];
  for (const x of others){ if (out.length === 4) break; if (!seen.has(A(x))){ seen.add(A(x)); out.push(A(x)); } }
  return shuffle(out);
}
function drawCard(){
  setMeta("Blok " + (bi + 1) + " van " + blocks.length + " · " + bDone + "/" + blocks[bi].length + " goed",
    bMissed.size ? bMissed.size + " fout" : "", [...streak.values()].reduce((a, b) => a + b, 0) / (blocks[bi].length * STREAK) * 100);
  const answered = picked !== null, right = A(cur);
  $("#stage").innerHTML = `
    <div class="card" id="card">
      <span class="q">${esc(Q(cur))}</span>
      ${answered ? (cur.ex ? `<span class="ex">${esc(cur.ex).replace(/\[(.+?)\]/g, "<b>$1</b>")}</span>` : `<span class="a">${esc(A(cur))}</span>`) : `<span class="tap">Kies de goede vertaling</span>`}
    </div>
    <div class="opts" role="group" aria-label="Antwoorden">
      ${opts.map((o, i) => {
        const cls = !answered ? "" : o === right ? "ok" : o === picked ? "no" : "dim";
        const ico = cls === "ok" ? ICON.check : cls === "no" ? ICON.x : `<span class="num" aria-hidden="true">${i + 1}</span>`;
        return `<button class="opt ${cls}" data-o="${esc(o)}" ${answered ? "disabled" : ""}>${ico}<span>${esc(o)}</span></button>`;
      }).join("")}
    </div>
    ${answered ? `<div class="btns" style="margin-top:16px"><button class="btn main" id="nextBtn">Volgende</button></div>` : ""}`;
  if (answered){ $("#nextBtn").onclick = grade; $("#nextBtn").focus({preventScroll:true}); }
  else document.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(b.dataset.o));
}
function choose(o){ if (picked === null){ picked = o; drawCard(); } }
function grade(){
  if (picked === A(cur)){
    const s = (streak.get(cur) || 0) + 1; streak.set(cur, s);
    if (s >= STREAK){ done++; bDone++; }
    else queue.splice(Math.min(queue.length, 4 + (Math.random() * 3 | 0)), 0, cur); // later in het blok nog eens
  } else {
    streak.set(cur, 0); missed.add(cur); bMissed.add(cur);
    queue.splice(Math.min(queue.length, 3), 0, cur); // komt snel terug
  }
  next();
}
function blockEnd(){
  if (bi === blocks.length - 1) return end();
  const m = [...bMissed];
  setMeta("Blok " + (bi + 1) + " van " + blocks.length + " klaar", "", 100);
  $("#stage").innerHTML = `<div class="card end">
    <h2>Blok ${bi + 1} klaar</h2>
    <p>${m.length ? `Je kent nu alle ${blocks[bi].length} woorden. Deze waren lastig:` : `Alle ${blocks[bi].length} woorden in één keer goed.`}</p>
    ${m.length ? `<ul class="miss">${m.map(w => `<li><b>${esc(w.f)}</b><span>${esc(w.n)}</span></li>`).join("")}</ul>` : ""}
  </div>
  <div class="btns" style="margin-top:16px">
    <button class="btn main" id="nextBlock">Volgende ${blocks[bi + 1].length} woorden</button>
    ${m.length ? `<button class="btn soft" id="redo" style="grid-column:1/-1">Dit blok nog een keer</button>` : ""}
  </div>`;
  $("#nextBlock").onclick = () => { bi++; startBlock(); };
  if (m.length) $("#redo").onclick = startBlock;
  $("#nextBlock").focus({preventScroll:true});
}
function end(){
  const m = [...missed];
  setMeta(total + " van " + total + " gekend", "", 100);
  $("#stage").innerHTML = `<div class="card end">
    <h2>${m.length ? "Klaar" : "Alles goed"}</h2>
    <p>${m.length ? `Deze ${m.length} woorden waren lastig:` : "Je kende alle " + total + " woorden in één keer."}</p>
    ${m.length ? `<ul class="miss">${m.map(w => `<li><b>${esc(w.f)}</b><span>${esc(w.n)}</span></li>`).join("")}</ul>` : ""}
  </div>
  <div class="btns" style="margin-top:16px"><button class="btn main" id="again">Opnieuw</button></div>`;
  $("#again").onclick = start;
}

// ---------- koppelen ----------
const PER = 5;
let rounds, ri, errors, sel, left;
function startMatch(){
  // geen dubbele vertalingen in één ronde (bv. twee keer 'kortom')
  rounds = [];
  for (const w of shuffle(pool())){
    let r = rounds.find(r => r.length < PER && !r.some(x => x.n === w.n || x.f === w.f));
    if (!r) rounds.push(r = []);
    r.push(w);
  }
  rounds = rounds.filter(r => r.length > 1); ri = 0; errors = 0; drawRound();
}
function drawRound(){
  const r = rounds[ri]; left = r.length; sel = null;
  setMeta("Ronde " + (ri + 1) + " van " + rounds.length, errors ? errors + " fout" : "", ri / rounds.length * 100);
  const tile = (w, side) => `<button class="tile" data-i="${r.indexOf(w)}" data-s="${side}">${esc(side === "q" ? Q(w) : A(w))}</button>`;
  $("#stage").innerHTML = `<div class="grid"><div class="col">${shuffle(r).map(w => tile(w, "q")).join("")}</div><div class="col">${shuffle(r).map(w => tile(w, "a")).join("")}</div></div>`;
  document.querySelectorAll(".tile").forEach(t => t.onclick = () => pick(t));
}
function pick(t){
  if (t.classList.contains("ok")) return;
  if (!sel || sel.dataset.s === t.dataset.s){
    sel?.classList.remove("sel");
    sel = sel === t ? null : t; sel?.classList.add("sel");
    return;
  }
  const a = sel; sel = null; a.classList.remove("sel");
  if (a.dataset.i === t.dataset.i){
    a.classList.add("ok"); t.classList.add("ok"); a.disabled = t.disabled = true;
    if (--left === 0) setTimeout(() => ++ri < rounds.length ? drawRound() : matchEnd(), 400);
  } else {
    errors++; setMeta("Ronde " + (ri + 1) + " van " + rounds.length, errors + " fout", ri / rounds.length * 100);
    for (const x of [a, t]){ x.classList.remove("no"); void x.offsetWidth; x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 400); }
  }
}
function matchEnd(){
  setMeta("Alle rondes klaar", "", 100);
  $("#stage").innerHTML = `<div class="card end"><h2>${errors ? "Klaar" : "Alles goed"}</h2>
    <p>${errors ? errors + " keer fout gekoppeld." : "Geen enkele fout."}</p></div>
    <div class="btns" style="margin-top:16px"><button class="btn main" id="again">Opnieuw</button></div>`;
  $("#again").onclick = start;
}

document.addEventListener("keydown", e => {
  if (mode !== "cards" || !cur || !$("#card")) return;
  if (picked === null && "1234".includes(e.key) && e.key) choose(opts[+e.key - 1]);
});

renderDir(); start();
</script>
</body>
</html>
